<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="UniDroid">
<meta name="application-name" content="UniDroid">
<meta name="description" content="Remote control and keyboard for your Android TV, box or projector.">
<meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
<meta name="theme-color" content="#f2f2f7" media="(prefers-color-scheme: light)">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="manifest" href="manifest.webmanifest">
<title>UniDroid Remote</title>
<style>
:root {
  --bg: #000; --fg: #f5f5f7; --dim: rgba(235,235,245,.55);
  --glass: rgba(255,255,255,.07); --glass-hi: rgba(255,255,255,.17);
  --edge: rgba(255,255,255,.13); --spec: rgba(255,255,255,.16);
  --shadow: 0 12px 32px rgba(0,0,0,.35);
  --field: rgba(118,118,128,.24);
  --accent: #0a84ff; --red: #ff453a; --green: #30d158; --orange: #ff9f0a;
  --glow1: rgba(10,132,255,.20); --glow2: rgba(191,90,242,.14); --touch: rgba(10,132,255,.38);
  --rim: rgba(120,180,255,.6);
  color-scheme: dark;
}
@media (prefers-color-scheme: light) {
  :root {
    --bg: #f2f2f7; --fg: #1d1d1f; --dim: rgba(60,60,67,.55);
    --glass: rgba(255,255,255,.6); --glass-hi: rgba(255,255,255,1);
    --edge: rgba(0,0,0,.07); --spec: rgba(255,255,255,.9);
    --shadow: 0 10px 28px rgba(0,0,0,.08);
    --field: rgba(118,118,128,.12);
    --accent: #007aff; --red: #ff3b30; --green: #34c759; --orange: #ff9500;
    --glow1: rgba(0,122,255,.13); --glow2: rgba(175,82,222,.10); --touch: rgba(0,122,255,.22);
    --rim: rgba(0,122,255,.45);
    color-scheme: light;
  }
}
:root[data-theme=dark] {
  --bg: #000; --fg: #f5f5f7; --dim: rgba(235,235,245,.55);
  --glass: rgba(255,255,255,.07); --glass-hi: rgba(255,255,255,.17);
  --edge: rgba(255,255,255,.13); --spec: rgba(255,255,255,.16);
  --shadow: 0 12px 32px rgba(0,0,0,.35);
  --field: rgba(118,118,128,.24);
  --accent: #0a84ff; --red: #ff453a; --green: #30d158; --orange: #ff9f0a;
  --glow1: rgba(10,132,255,.20); --glow2: rgba(191,90,242,.14); --touch: rgba(10,132,255,.38);
  --rim: rgba(120,180,255,.6);
  color-scheme: dark;
}
:root[data-theme=light] {
    --bg: #f2f2f7; --fg: #1d1d1f; --dim: rgba(60,60,67,.55);
    --glass: rgba(255,255,255,.6); --glass-hi: rgba(255,255,255,1);
    --edge: rgba(0,0,0,.07); --spec: rgba(255,255,255,.9);
    --shadow: 0 10px 28px rgba(0,0,0,.08);
    --field: rgba(118,118,128,.12);
    --accent: #007aff; --red: #ff3b30; --green: #34c759; --orange: #ff9500;
    --glow1: rgba(0,122,255,.13); --glow2: rgba(175,82,222,.10); --touch: rgba(0,122,255,.22);
    --rim: rgba(0,122,255,.45);
  color-scheme: light;
}
@property --a { syntax: '<angle>'; inherits: false; initial-value: 0deg; }

* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; height: 100%; }
body {
  background: var(--bg);
  color: var(--fg);
  font: 17px/1.3 -apple-system, BlinkMacSystemFont, "SF Pro Text", system-ui, "Segoe UI", Roboto, sans-serif;
  letter-spacing: -.01em;
  -webkit-user-select: none; user-select: none; -webkit-touch-callout: none;
  overscroll-behavior: none; touch-action: manipulation;
  -webkit-font-smoothing: antialiased;
}

body::before {
  content: ""; position: fixed; inset: 0; z-index: -1; pointer-events: none;
  background:
    radial-gradient(70% 45% at 50% 34%, var(--glow1), transparent 70%),
    radial-gradient(55% 35% at 85% 100%, var(--glow2), transparent 70%);
}
.app {
  min-height: 100dvh; max-width: 440px; margin: 0 auto;
  display: flex; flex-direction: column; gap: 26px;
  padding: calc(env(safe-area-inset-top) + 14px) 22px calc(env(safe-area-inset-bottom) + 22px);
}

.glass {
  background: var(--glass);
  border: .5px solid var(--edge);
  box-shadow: inset 0 1px 0 var(--spec), var(--shadow);
  -webkit-backdrop-filter: blur(28px) saturate(170%);
  backdrop-filter: blur(28px) saturate(170%);
}
.i { width: 26px; height: 26px; display: block; pointer-events: none; }

/* ---------- header */
header { display: flex; align-items: center; gap: 10px; }
.install {
  display: none; align-items: center; gap: 12px; padding: 12px 14px; border-radius: 18px;
  font-size: 14px; line-height: 1.35; color: var(--fg);
}
body.browser .install { display: flex; }
.install svg { flex: none; width: 22px; height: 22px; color: var(--accent); }
.install b { font-weight: 600; }
.install .x { margin-left: auto; flex: none; width: 30px; height: 30px; border: 0; background: none; color: inherit; font-size: 20px; opacity: .6; }
.status {
  display: flex; align-items: center; gap: 8px; height: 38px; padding: 0 15px 0 13px;
  border-radius: 19px; font-size: 15px; font-weight: 600; margin-right: auto; min-width: 0;
}
.status #dev { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.dot { width: 8px; height: 8px; border-radius: 50%; flex: none; background: var(--orange); box-shadow: 0 0 10px var(--orange); transition: background .3s, box-shadow .3s; }
body[data-conn=online] .dot { background: var(--green); box-shadow: 0 0 10px var(--green); }
body[data-conn=offline] .dot { background: var(--red); box-shadow: 0 0 10px var(--red); }
body[data-conn=connecting] .dot { animation: breathe 1.2s ease-in-out infinite; }
#lat { color: var(--dim); font-weight: 500; font-variant-numeric: tabular-nums; }
@keyframes breathe { 50% { opacity: .3; } }

/* ---------- buttons */
.btn {
  appearance: none; border: 0; padding: 0; margin: 0; font: inherit; color: var(--fg);
  display: grid; place-items: center; cursor: pointer;
  transition: transform .45s cubic-bezier(.2,1.7,.35,1), background-color .25s;
}
.btn.pressed { transform: scale(.88); background-color: var(--glass-hi); transition-duration: .07s; }
.round { width: 68px; height: 68px; border-radius: 50%; justify-self: center; }
.small { width: 40px; height: 40px; border-radius: 50%; }
.small .i { width: 21px; height: 21px; }
.power { width: 52px; height: 52px; border-radius: 50%; color: var(--red); }
.power .i { width: 26px; height: 26px; }

/* ---------- touch pad */
.pad-wrap { flex: 1; display: grid; place-items: center; }
.pad {
  position: relative; width: min(80vw, 320px, 44dvh); aspect-ratio: 1; border-radius: 50%;
  touch-action: none; overflow: hidden; cursor: pointer;
}
.pad::before {
  content: ""; position: absolute; inset: 0; border-radius: 50%; padding: 1.3px;
  background: conic-gradient(from var(--a), transparent 0 50%, var(--rim) 72%, transparent 94%);
  -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
  -webkit-mask-composite: xor; mask-composite: exclude;
  animation: spin 9s linear infinite; pointer-events: none;
}
body[data-conn=offline] .pad::before { animation-play-state: paused; opacity: .25; }
.pad::after {
  content: ""; position: absolute; inset: 0; pointer-events: none; opacity: 0;
  background: radial-gradient(circle 95px at var(--x, 50%) var(--y, 50%), var(--touch), transparent 70%);
  transition: opacity .35s;
}
.pad.touch::after { opacity: 1; transition-duration: .05s; }
.pad .ok {
  position: absolute; inset: 31%; border-radius: 50%;
  border: .5px solid var(--edge); background: var(--glass);
  box-shadow: inset 0 1px 0 var(--spec);
  transition: transform .45s cubic-bezier(.2,1.7,.35,1), background-color .25s;
}
.pad .chev { position: absolute; width: 22px; height: 22px; color: var(--dim); transition: color .3s; }
.chev[data-z=UP]    { top: 9%;    left: calc(50% - 11px); }
.chev[data-z=DOWN]  { bottom: 9%; left: calc(50% - 11px); }
.chev[data-z=LEFT]  { left: 9%;   top: calc(50% - 11px); }
.chev[data-z=RIGHT] { right: 9%;  top: calc(50% - 11px); }
.chev.on { color: var(--accent); animation: blip .28s ease-out; transition-duration: 0s; }
.ok.on { transform: scale(.92); background-color: var(--glass-hi); transition-duration: .07s; }
@keyframes blip { 40% { transform: scale(1.35); } }
@keyframes spin { to { --a: 360deg; } }

/* ---------- control center grid: tiles the user arranges like iOS Control Center */
.status { cursor: pointer; }
.status .i { width: 15px; height: 15px; color: var(--dim); flex: none; }
.grid { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); grid-auto-rows: var(--cell, 76px); gap: 12px; grid-auto-flow: dense; }
.tile {
  position: relative; min-width: 0; border-radius: 26px; display: flex; align-items: center; justify-content: center;
  gap: 10px; color: var(--fg); touch-action: none; -webkit-user-select: none; user-select: none;
  transition: transform .45s cubic-bezier(.2,1.7,.35,1), background-color .25s;
}
.tile.round { border-radius: 50%; }
.tile.pressed { transform: scale(.9); background-color: var(--glass-hi); transition-duration: .07s; }
.tile .i { width: 26px; height: 26px; }
.tile img { width: 36px; height: 36px; border-radius: 10px; pointer-events: none; }
.tile .k { font-size: 15px; font-weight: 700; }
.tile .lab { display: flex; flex-direction: column; min-width: 0; pointer-events: none; }
.tile .lab b { font-size: 14px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.tile .lab small { font-size: 12px; color: var(--dim); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.tile.wide { justify-content: flex-start; padding: 0 16px; }
.tile.padtile { background: none; border: 0; box-shadow: none; -webkit-backdrop-filter: none; backdrop-filter: none; }
.tile .pad { width: 100%; height: 100%; }
.tile.vol { flex-direction: column; gap: 0; padding: 0; }
/* No overflow clipping (it would cut the edit badge and handle): the halves round themselves. */
.tile.vol .half:first-child { border-radius: 26px 26px 0 0; }
.tile.vol .half:last-child { border-radius: 0 0 26px 26px; }
.tile.vol.h .half:first-child { border-radius: 26px 0 0 26px; }
.tile.vol.h .half:last-child { border-radius: 0 26px 26px 0; }
.tile.vol.h { flex-direction: row; }
.tile.vol .half { flex: 1; align-self: stretch; display: grid; place-items: center; }
.tile.vol .half.pressed { background: var(--glass-hi); }
.tile.vol .sep { flex: none; background: var(--edge); width: 60%; height: 1px; }
.tile.vol.h .sep { width: 1px; height: 60%; }
.tile.sleep.on { background: var(--accent); color: #fff; }
.tile.sleep.on .lab small { color: rgba(255,255,255,.8); }
.tile .cd { display: flex; flex-direction: column; align-items: center; line-height: 1; pointer-events: none; }
.tile .cd b { font-size: 22px; font-weight: 700; }
.tile .cd small { font-size: 11px; font-weight: 600; opacity: .85; margin-top: 2px; }
/* editing: tiles wiggle, show a remove badge and a resize handle, and can be dragged */
body.editing .tile { animation: wiggle .32s ease-in-out infinite alternate; }
body.editing .tile:nth-child(2n) { animation-delay: -.16s; }
body.editing .tile.drag { animation: none; z-index: 5; transition: none; opacity: .92; }
@keyframes wiggle { from { rotate: -1.1deg; } to { rotate: 1.1deg; } }
.tile .minus, .tile .size { display: none; position: absolute; border: 0; padding: 0; }
body.editing .tile .minus, body.editing .tile .size { display: grid; place-items: center; }
.tile .minus { top: -6px; left: -6px; width: 26px; height: 26px; border-radius: 50%; background: rgba(120,120,128,.9); color: #fff; font-size: 20px; line-height: 1; z-index: 2; }
.tile .size { right: -4px; bottom: -4px; width: 26px; height: 26px; border-radius: 50%; background: none; color: var(--fg); z-index: 2; }
.tile .size::before { content: ""; width: 14px; height: 14px; border: 3px solid currentColor; border-top: 0; border-left: 0; border-radius: 0 0 12px 0; }
.ccbar { display: none; justify-content: center; gap: 10px; flex-wrap: wrap; }
.seg { display: flex; gap: 6px; padding: 4px; border-radius: 14px; background: var(--field); }
.seg button { flex: 1; height: 36px; border: 0; border-radius: 10px; background: none; color: var(--fg); font: inherit; font-size: 14px; font-weight: 600; }
.seg button.on { background: var(--glass-hi); }
.dots { display: flex; gap: 14px; flex-wrap: wrap; padding: 6px 4px; }
.dots button { width: 40px; height: 40px; border-radius: 50%; border: 3px solid transparent; }
.dots button.on { border-color: var(--fg); }
body.editing .ccbar { display: flex; }
.ccbar .btn { height: 48px; padding: 0 22px; border-radius: 24px; font-weight: 600; gap: 8px; display: flex; }
#cc-done { display: none; height: 40px; padding: 0 18px; border-radius: 20px; font-weight: 600; background: var(--accent); color: #fff; border: 0; }
body.editing #cc-done { display: block; }
body.editing .power { display: none; }
/* gallery of controls to add */
body.pick-open #pick { display: flex; }
.cbtn { display: flex; flex-direction: column; align-items: center; gap: 6px; min-width: 0; cursor: pointer; }
.cbtn .btn { width: 58px; height: 58px; border-radius: 50%; }
.cbtn .btn img { width: 34px; height: 34px; border-radius: 9px; pointer-events: none; }
.cbtn .btn .k { font-size: 14px; font-weight: 700; pointer-events: none; }
.cbtn span { font-size: 11.5px; color: var(--dim); max-width: 100%; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; text-align: center; }
.pick .gal { display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px 8px; padding: 4px 0 8px; }
.pick form { display: flex; flex-direction: column; gap: 10px; }
.pick input, .pinbox input { height: 48px; border-radius: 14px; border: 0; padding: 0 14px; background: var(--field); color: var(--fg); font: inherit; -webkit-user-select: text; user-select: text; }
.pick .note { color: var(--dim); font-size: 14px; text-align: center; padding: 12px; }
.switch { width: 50px; height: 30px; border-radius: 15px; background: var(--field); position: relative; flex: none; transition: background .2s; }
.switch::after { content: ""; position: absolute; top: 2px; left: 2px; width: 26px; height: 26px; border-radius: 50%; background: #fff; box-shadow: 0 2px 6px rgba(0,0,0,.3); transition: transform .2s; }
.on > .switch { background: var(--green); }
.on > .switch::after { transform: translateX(20px); }
/* pairing: the code shown on the TV */
.pinbox { position: fixed; inset: 0; z-index: 40; display: none; place-items: center; background: rgba(0,0,0,.6); padding: 24px; }
body.pairing .pinbox { display: grid; }
.pinbox form { display: flex; flex-direction: column; gap: 12px; width: min(340px, 100%); padding: 22px; border-radius: 24px; text-align: center; }
.pinbox b { font-size: 19px; }
.pinbox small { color: var(--dim); font-size: 14px; line-height: 1.4; }
.pinbox input { text-align: center; font-size: 30px; letter-spacing: .5em; padding-left: .5em; }
.pinbox .err { color: var(--red); }

/* ---------- keyboard sheet */
.sheet {
  position: fixed; left: 12px; right: 12px; bottom: calc(var(--kb, 0px) + 12px); z-index: 10;
  max-width: 520px; margin: 0 auto; padding: 10px; border-radius: 28px;
  display: flex; gap: 8px; align-items: center;
  transform: translateY(calc(100% + 60px)); opacity: 0; pointer-events: none;
  transition: transform .5s cubic-bezier(.2,1.15,.3,1), opacity .25s;
}
body.typing .sheet { transform: none; opacity: 1; pointer-events: auto; }
.sheet input {
  flex: 1; min-width: 0; height: 44px; border: 0; border-radius: 22px; padding: 0 16px;
  font: inherit; font-size: 17px; color: var(--fg); background: var(--field); outline: none;
  -webkit-user-select: text; user-select: text;
}
.sheet input::placeholder { color: var(--dim); }
.sheet .btn { width: 44px; height: 44px; border-radius: 50%; flex: none; background: var(--field); }
.sheet .btn .i { width: 21px; height: 21px; }
.sheet .done { background: var(--accent); color: #fff; }

/* ---------- web mode: the projector shows the page, the phone holds the browser */
#web, #mouse { display: none; }
body.mouse .app { display: none; }
body.mouse #mouse {
  display: flex; flex-direction: column; gap: 14px; min-height: 100dvh; max-width: 520px; margin: 0 auto;
  padding: calc(env(safe-area-inset-top) + 14px) 16px calc(env(safe-area-inset-bottom) + 16px);
}
#mouse header { gap: 12px; }
.mtitle { font-size: 17px; font-weight: 600; }
.hbtn { width: 44px; height: 44px; border-radius: 50%; }
.hbtn .i { width: 22px; height: 22px; }
body.web .app { display: none; }
body.web #web {
  display: flex; flex-direction: column; gap: 14px; min-height: 100dvh; max-width: 520px; margin: 0 auto;
  padding: calc(env(safe-area-inset-top) + 14px) 16px calc(env(safe-area-inset-bottom) + 16px);
}
#web header { gap: 8px; }
.addr { position: relative; flex: 1; min-width: 0; display: flex; align-items: center; height: 44px; border-radius: 22px; padding: 0 6px 0 16px; overflow: hidden; }
.addr input {
  flex: 1; min-width: 0; height: 100%; border: 0; background: none; outline: none; color: var(--fg);
  font: inherit; font-size: 16px; -webkit-user-select: text; user-select: text;
}
.addr input::placeholder { color: var(--dim); }
.addr .bar { position: absolute; left: 0; bottom: 0; height: 2.5px; background: var(--accent); width: 0; transition: width .3s, opacity .4s; }
.addr .btn { width: 34px; height: 34px; border-radius: 50%; flex: none; }
.addr .btn .i { width: 19px; height: 19px; }
.webbar { display: flex; justify-content: space-between; gap: 6px; }
.webbar .btn { width: 52px; height: 46px; border-radius: 23px; position: relative; }
.webbar .btn .i { width: 22px; height: 22px; }
.webbar .btn:disabled { opacity: .3; }
.webbar .btn.on { color: var(--accent); }
.count {
  position: absolute; inset: 0; display: grid; place-items: center; font-size: 12px; font-weight: 700;
  pointer-events: none;
}
.track {
  flex: 1; min-height: 240px; border-radius: 30px; position: relative; touch-action: none; overflow: hidden;
  display: grid; place-items: center; color: var(--dim); font-size: 14px; text-align: center; line-height: 1.5;
}
.track .hint { pointer-events: none; padding: 0 56px 0 30px; transition: opacity .4s; }
.track.used .hint { opacity: 0; }
.track::after {
  content: ""; position: absolute; inset: 0; pointer-events: none; opacity: 0;
  background: radial-gradient(circle 80px at var(--x, 50%) var(--y, 50%), var(--touch), transparent 70%);
  transition: opacity .35s;
}
.track.touch::after { opacity: 1; transition-duration: .05s; }
.track .strip { position: absolute; top: 14px; bottom: 14px; right: 8px; width: 34px; border-radius: 17px; background: var(--field); }
.track .strip::before { content: "⇅"; position: absolute; inset: 0; display: grid; place-items: center; font-size: 15px; color: var(--dim); }
.webkeys { display: flex; justify-content: space-between; gap: 8px; }
.webkeys .btn { flex: 1; height: 54px; border-radius: 27px; font-size: 15px; font-weight: 600; }
.closed-note { display: none; text-align: center; color: var(--dim); font-size: 14px; }
body.web-closed .closed-note { display: block; }
.tabs {
  position: fixed; inset: 0; z-index: 20; display: none; flex-direction: column; gap: 10px;
  padding: calc(env(safe-area-inset-top) + 16px) 16px calc(env(safe-area-inset-bottom) + 16px);
  background: var(--bg); overflow-y: auto;
}
body.tabs-open .tabs { display: flex; }
.tabs h2 { margin: 6px 4px 0; font-size: 13px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; color: var(--dim); }
.tabs .row { display: flex; align-items: center; gap: 10px; min-height: 58px; padding: 8px 8px 8px 16px; border-radius: 18px; }
.tabs .row.active { outline: 2px solid var(--accent); }
.tabs .row .t { flex: 1; min-width: 0; }
.tabs .row b, .tabs .row small { display: block; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.tabs .row b { font-size: 15px; font-weight: 600; }
.tabs .row small { font-size: 12.5px; color: var(--dim); margin-top: 2px; }
.tabs .row .x { width: 36px; height: 36px; border-radius: 50%; flex: none; font-size: 20px; color: var(--dim); background: none; }
.tabs .top { display: flex; gap: 10px; }
.tabs .top .btn { flex: 1; height: 48px; border-radius: 24px; font-weight: 600; }
.tabs .top .btn.primary { background: var(--accent); color: #fff; border: 0; }

/* ---------- landscape / tablets */
@media (orientation: landscape) and (min-width: 600px) {
  .app { max-width: 900px; display: grid; grid-template-columns: 1fr 1fr; grid-template-rows: auto 1fr; column-gap: 48px; }
  header { grid-column: 1 / -1; }
  .pad { width: min(42vw, 70dvh, 380px); }
  .grid, .ccbar { grid-column: 1 / -1; }
}
@media (prefers-reduced-motion: reduce) {
  *, .pad::before { animation: none !important; transition-duration: 0s !important; }
}
</style>
</head>
<body data-conn="connecting">

<!-- Icons: original drawings in the style of SF Symbols (24px grid, rounded strokes).
     Swap any <symbol> here to restyle the whole remote. -->
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>

<script>
'use strict';
const $ = s => document.querySelector(s);
const KEY = { UP: 19, DOWN: 20, LEFT: 21, RIGHT: 22, OK: 23 };

// ---------------------------------------------------------------- identity
// A random id kept on this phone, and whether the remote runs from the home screen:
// the TV shows a QR code until one device has added the remote to its home screen.
const installed = navigator.standalone === true || matchMedia('(display-mode: standalone)').matches;
let deviceId = '';
try {
  deviceId = localStorage.getItem('udr-id') || '';
  if (!/^[A-Za-z0-9-]{8,64}$/.test(deviceId)) {
    deviceId = (crypto.randomUUID ? crypto.randomUUID() : Date.now().toString(36) + Math.random().toString(36).slice(2, 12));
    localStorage.setItem('udr-id', deviceId);
  }
} catch (e) { deviceId = 'session-' + Math.random().toString(36).slice(2, 12); }
const ua = navigator.userAgent;
const deviceName = /iPhone/.test(ua) ? 'iPhone' : /iPad/.test(ua) || (/Macintosh/.test(ua) && navigator.maxTouchPoints > 1) ? 'iPad'
  : /Android/.test(ua) ? 'Android' : /Macintosh/.test(ua) ? 'Mac' : /Windows/.test(ua) ? 'PC' : 'Browser';

// Until it is installed: how to add it to the home screen (iOS: Share, then Add to Home Screen).
const fr = (navigator.language || '').toLowerCase().startsWith('fr');
let hintClosed = false;
try { hintClosed = sessionStorage.getItem('udr-hint') === '0'; } catch (e) { /* ignore */ }
if (!installed && !hintClosed) {
  document.body.classList.add('browser');
  const ios = deviceName === 'iPhone' || deviceName === 'iPad';
  $('#install-text').innerHTML = ios
    ? (fr ? 'Garde la télécommande : <b>Partager</b> › <b>Sur l’écran d’accueil</b>'
          : 'Keep the remote: <b>Share</b> › <b>Add to Home Screen</b>')
    : (fr ? 'Garde la télécommande : menu du navigateur › <b>Installer</b> ou <b>Ajouter à l’écran d’accueil</b>'
          : 'Keep the remote: browser menu › <b>Install</b> or <b>Add to Home screen</b>');
  $('#install-close').addEventListener('click', () => {
    document.body.classList.remove('browser');
    try { sessionStorage.setItem('udr-hint', '0'); } catch (e) { /* ignore */ }
  });
}

// ---------------------------------------------------------------- connection
let ws = null, retry = 0, pingAt = 0, retryTimer = 0;

function connect() {
  clearTimeout(retryTimer);
  document.body.dataset.conn = 'connecting';
  try {
    ws = new WebSocket((location.protocol === 'https:' ? 'wss://' : 'ws://') + location.host + '/ws');
  } catch (e) { return reconnectLater(); }
  ws.onopen = () => {
    retry = 0;
    document.body.dataset.conn = 'online';
    ws.send(helloMsg(''));
    if (document.body.classList.contains('web')) ws.send('w:state');
    ping();
  };
  ws.onmessage = e => {
    if (e.data.startsWith('w:')) { web.state(e.data.slice(2)); return; }
    if (e.data.startsWith('l:')) { cc.apply(e.data.slice(2)); return; }
    if (e.data === 'x:pair') { pairing.ask(); return; }
    if (e.data === 'x:wrong') { pairing.wrong(); return; }
    if (e.data === 'x:ok') { pairing.ok(); return; }
    if (e.data.startsWith('z:')) { cc.sleepAt(+e.data.slice(2)); return; }
    if (e.data === 'p') {
      $('#lat').textContent = Math.max(1, Math.round(performance.now() - pingAt)) + ' ms';
    } else if (e.data.startsWith('i:')) {
      try {
        const info = JSON.parse(e.data.slice(2));
        // A new version of the app was installed: load its page (an open home-screen app keeps the old one).
        if (info.page && pageId && info.page !== pageId) { location.reload(); return; }
        pageId = info.page;
        $('#dev').textContent = info.name || 'Android';
        document.title = (info.name || 'Android') + ' · Remote';
      } catch (err) { /* ignore */ }
    }
  };
  ws.onclose = () => { ws = null; document.body.dataset.conn = 'offline'; $('#lat').textContent = ''; reconnectLater(); };
  ws.onerror = () => { try { ws.close(); } catch (err) { /* ignore */ } };
}
function reconnectLater() {
  clearTimeout(retryTimer);
  retryTimer = setTimeout(connect, Math.min(4000, 250 * 2 ** retry++));
}
function ping() {
  if (ws && ws.readyState === 1) { pingAt = performance.now(); ws.send('p'); }
}
setInterval(() => { if (!document.hidden) ping(); }, 5000);
document.addEventListener('visibilitychange', () => {
  if (!document.hidden && (!ws || ws.readyState > 1)) { retry = 0; connect(); }
});

// WebSocket first; plain HTTP as a fallback (no hold/repeat there).
let pageId = null;
const helloMsg = code => 'h:' + deviceId + '\t' + (installed ? 1 : 0) + '\t' + deviceName + (code ? '\t' + code : '');
/** Identifies this (paired) phone on HTTP calls. */
const authHeaders = () => ({ 'X-UDR-Device': deviceId });
function send(msg) {
  if (ws && ws.readyState === 1) { ws.send(msg); return; }
  const type = msg[0], arg = msg.slice(2);
  if (type === 'k' || type === 'u') fetch('/key?k=' + arg).catch(() => {});
  else if (type === 't') fetch('/text?t=' + encodeURIComponent(arg)).catch(() => {});
  else if (type === 'b') for (let i = 0; i < +arg; i++) fetch('/key?k=67').catch(() => {});
  else if (type === 'a') fetch('/action?a=' + encodeURIComponent(arg)).catch(() => {});
}

// ---------------------------------------------------------------- haptics
// A short buzz where the browser allows it (Android); iPhones have no vibration API.
function haptic() {
  if (navigator.vibrate) navigator.vibrate(8);
}

// ---------------------------------------------------------------- buttons
// Press = key down, release = key up: holding a button repeats like a real remote.
const noDefault = e => e.preventDefault();
document.querySelectorAll('[data-key]').forEach(btn => {
  const code = btn.dataset.key;
  let held = false;
  btn.addEventListener('touchstart', noDefault, { passive: false });
  btn.addEventListener('pointerdown', e => {
    e.preventDefault();
    // The keyboard sheet's Delete and Enter type into the page while the browser is open.
    if (inWeb() && (code === '67' || code === '66')) {
      haptic();
      if (code === '66') { pressEnter(); field.value = ''; mirrored = []; return; }
      const chars = [...field.value];
      if (chars.length) { chars.pop(); field.value = chars.join(''); mirrored = chars; }
      deleteChars(1);
      return;
    }
    btn.setPointerCapture(e.pointerId);
    held = true;
    btn.classList.add('pressed');
    haptic();
    send('d:' + code);
  });
  const release = () => {
    if (!held) return;
    held = false;
    btn.classList.remove('pressed');
    send('u:' + code);
  };
  btn.addEventListener('pointerup', release);
  btn.addEventListener('pointercancel', release);
  btn.addEventListener('lostpointercapture', release);
});

// Actions (open a screen, launch an app) fire once, on release.
document.querySelectorAll('[data-action]').forEach(btn => {
  btn.addEventListener('touchstart', noDefault, { passive: false });
  btn.addEventListener('pointerdown', e => {
    e.preventDefault();
    btn.classList.add('pressed');
    haptic();
  });
  btn.addEventListener('pointerup', () => {
    if (!btn.classList.contains('pressed')) return;
    btn.classList.remove('pressed');
    send('a:' + btn.dataset.action);
  });
  btn.addEventListener('pointerleave', () => btn.classList.remove('pressed'));
  btn.addEventListener('pointercancel', () => btn.classList.remove('pressed'));
});

// ---------------------------------------------------------------- touch pad
// Tap: direction by zone (centre = OK). Swipe: one step every 34 px. Hold: key repeat.
const pad = $('#pad');
const STEP = 34, HOLD_MS = 320, DEAD_PX = 10;
let gesture = null;

function zoneAt(x, y) {
  const r = pad.getBoundingClientRect();
  const dx = x - (r.left + r.width / 2), dy = y - (r.top + r.height / 2);

// Live typing: every change in the field is mirrored on the TV (backspaces + new text).
// With the browser open, text goes straight into the page instead of as key strokes.
const field = $('#text');

function inWeb() { return document.body.classList.contains('web'); }
const typeText = t => send(inWeb() ? 'w:type ' + t : 't:' + t);

  field.value = ''; mirrored = [];

  document.body.classList.remove('typing');

  if (document.activeElement !== field) document.body.classList.remove('typing');
}, 150));
field.addEventListener('input', () => {
  const now = [...field.value];
  let same = 0;
  while (same < mirrored.length && same < now.length && mirrored[same] === now[same]) same++;
  const removed = mirrored.length - same;
  if (removed > 0) deleteChars(removed);
  if (now.length > same) typeText(now.slice(same).join(''));
  mirrored = now;
});

  if (e.key === 'Enter') { e.preventDefault(); pressEnter(); field.value = ''; mirrored = []; }

  // ---- pressing tiles (ignored while editing)
  function holdKey(el, code) {
    let held = false;
    el.addEventListener('pointerdown', e => {
      if (editing) return;
      e.preventDefault(); el.setPointerCapture(e.pointerId);
      held = true; el.classList.add('pressed'); haptic(); send('d:' + code);
    });
    const up = () => { if (!held) return; held = false; el.classList.remove('pressed'); send('u:' + code); };
    el.addEventListener('pointerup', up); el.addEventListener('pointercancel', up); el.addEventListener('lostpointercapture', up);
  }
  function tapTile(el, fn) {
    el.addEventListener('pointerdown', e => { if (editing) return; e.preventDefault(); el.classList.add('pressed'); });
    el.addEventListener('pointerup', () => { if (!el.classList.contains('pressed')) return; el.classList.remove('pressed'); haptic(); fn(); });
    el.addEventListener('pointerleave', () => el.classList.remove('pressed'));
    el.addEventListener('pointercancel', () => el.classList.remove('pressed'));
  }

  // ---- render
  function sleepLabel() {
    const left = Math.ceil((sleepDeadline - Date.now()) / 60000);
    return sleepDeadline > 0 && left > 0 ? T.min(left) : T.off;
  }
  function render() {
    $('#padhome').appendChild($('#pad')); // keep the pad element (its gestures are bound once)
    grid.innerHTML = '';
    L.tiles.forEach((tile, idx) => {
      if (!sizesOf(tile).includes(tile.s)) tile.s = sizesOf(tile)[0]; // older layouts had more sizes
      const [w, h] = tile.s.split('x').map(Number);
      const el = document.createElement('div');
      el.className = 'tile glass';
      el.style.gridColumn = 'span ' + w; el.style.gridRow = 'span ' + h;
      el.dataset.i = idx;
      const b = TYPES[tile.t];
      if (tile.t === 'pad') {
        el.classList.add('padtile'); el.appendChild($('#pad'));
      } else if (tile.t === 'volume') {
        el.classList.add('vol'); if (w > h) el.classList.add('h');
        const minus = '<div class="half" data-k="25">' + icon('i-minus') + '</div>', plus = '<div class="half" data-k="24">' + icon('i-plus') + '</div>';
        el.innerHTML = (w > h ? minus + '<div class="sep"></div>' + plus : plus + '<div class="sep"></div>' + minus);
        el.querySelectorAll('.half').forEach(half => holdKey(half, half.dataset.k));
      } else {
        const it = info(tile);
        const wide = w > 1;
        if (w === 1 && h === 1) el.classList.add('round');
        if (wide) el.classList.add('wide');
        let sub = '';
        let face = it.face;
        if (tile.t === 'sleep') {
          sub = sleepLabel(); el.classList.add('sleep');
          const left = Math.ceil((sleepDeadline - Date.now()) / 60000);
          el.classList.toggle('on', left > 0);
          if (left > 0) face = '<span class="cd"><b>' + left + '</b><small>min</small></span>';
        }
        el.innerHTML = face + (wide ? '<span class="lab"><b>' + esc(it.label) + '</b>' + (sub ? '<small>' + esc(sub) + '</small>' : '') + '</span>' : '');
        el.setAttribute('aria-label', it.label);
        if (b && b.key) holdKey(el, b.key);
        else tapTile(el, () => press(tile));
      }
      // edit controls
      const minus = document.createElement('button'); minus.className = 'minus'; minus.textContent = '−'; minus.setAttribute('aria-label', 'Remove');
      minus.addEventListener('pointerdown', e => e.stopPropagation());
      minus.addEventListener('click', e => { e.stopPropagation(); L.tiles.splice(idx, 1); haptic(); save(); });
      el.appendChild(minus);
      const sizes = sizesOf(tile);
      if (sizes.length > 1) {
        const sz = document.createElement('button'); sz.className = 'size'; sz.setAttribute('aria-label', 'Size');
        sz.addEventListener('pointerdown', e => e.stopPropagation());
        sz.addEventListener('click', e => { e.stopPropagation(); tile.s = sizes[(sizes.indexOf(tile.s) + 1) % sizes.length]; haptic(); save(); });
        el.appendChild(sz);
      }
      draggable(el);
      grid.appendChild(el);
    });
  }
  function press(tile) {
    const b = TYPES[tile.t];
    if (tile.t === 'sleep') {
      // Cycles Off → 15 → 30 → 60 → 90 → Off from what is set now.
      const left = sleepDeadline > Date.now() ? Math.ceil((sleepDeadline - Date.now()) / 60000) : 0;
      const next = SLEEP.find(m => m > left) || 0;
      send('a:sleep:' + next);
    } else if (b && b.action) send('a:' + b.action);
    else if (b && b.run) b.run();
    else if (tile.t === 'app') send('a:launch:' + tile.pkg);
    else if (tile.t === 'action') send('a:' + tile.a);
    else if (tile.t === 'url') send('a:url:' + tile.url);
    else if (tile.t === 'key') { send('k:' + tile.k); }
  }

  // ---- drag to reorder (editing only)
  function draggable(el) {
    let start = null, grab = null, moving = false;
    el.addEventListener('pointerdown', e => {
      if (!editing) return;
      e.preventDefault();
      try { el.setPointerCapture(e.pointerId); } catch (err) { /* synthetic pointer */ }
      const r = el.getBoundingClientRect();
      start = { x: e.clientX, y: e.clientY }; grab = { x: e.clientX - r.left, y: e.clientY - r.top }; moving = false;
    });
    el.addEventListener('pointermove', e => {
      if (!start) return;
      if (!moving && Math.hypot(e.clientX - start.x, e.clientY - start.y) < 6) return;
      if (!moving) { moving = true; el.classList.add('drag'); haptic(); }
      // Over another tile: take its place.
      el.style.pointerEvents = 'none';
      const under = document.elementFromPoint(e.clientX, e.clientY);
      el.style.pointerEvents = '';
      const other = under && under.closest('.tile');
      if (other && other !== el && other.parentNode === grid) {
        const kids = [...grid.children];
        const from = kids.indexOf(el), to = kids.indexOf(other);
        grid.insertBefore(el, from < to ? other.nextSibling : other);
      }
      el.style.transform = 'none';
      const r = el.getBoundingClientRect();
      el.style.transform = 'translate(' + (e.clientX - r.left - grab.x) + 'px,' + (e.clientY - r.top - grab.y) + 'px)';
    });
    const end = () => {
      if (!start) return;
      start = null;
      if (!moving) return;
      el.classList.remove('drag'); el.style.transform = '';
      const order = [...grid.children].map(k => L.tiles[+k.dataset.i]);
      L.tiles = order; save();
    };
    el.addEventListener('pointerup', end); el.addEventListener('pointercancel', end);
  }

  // ---- edit mode
  function edit(on) {
    editing = on;
    document.body.classList.toggle('editing', on);
    if (on) haptic();
  }
  $('#status').insertAdjacentHTML('beforeend', icon('i-edit'));
  $('#status').addEventListener('click', () => edit(!editing));
  $('#cc-done').textContent = T.done;
  $('#cc-done').addEventListener('click', () => edit(false));
  $('#cc-add').innerHTML = icon('i-plus') + esc(T.add);
  $('#cc-add').addEventListener('click', openPicker);
  // Holding an empty spot of the grid also starts editing, as in Control Center.
  let emptyHold = 0;
  grid.addEventListener('pointerdown', e => { if (e.target === grid) emptyHold = setTimeout(() => edit(true), 550); });
  ['pointerup', 'pointercancel', 'pointerleave'].forEach(n => grid.addEventListener(n, () => clearTimeout(emptyHold)));

  // ---- gallery
  function gal(items) {
    const g = document.createElement('div'); g.className = 'gal';
    items.forEach(tile => {
      const it = info(tile);
      const c = document.createElement('div'); c.className = 'cbtn';
      c.innerHTML = '<span class="btn glass">' + it.face + '</span><span>' + esc(it.label) + '</span>';
      c.addEventListener('click', () => add(tile));
      g.appendChild(c);
    });
    return g;
  }
  function h2(text, body) { const h = document.createElement('h2'); h.textContent = text; body.appendChild(h); }
  function add(tile) {
    tile.s = tile.s || sizesOf(tile)[0];
    L.tiles.push(tile); haptic();
    document.body.classList.remove('pick-open');
    save();
    setTimeout(() => grid.lastElementChild && grid.lastElementChild.scrollIntoView({ behavior: 'smooth', block: 'center' }), 50);
  }
  async function openPicker() {
    const body = $('#pick-body'); body.innerHTML = '';
    document.body.classList.add('pick-open');
    const present = new Set(L.tiles.map(x => x.t));
    h2(T.remote, body);
    body.appendChild(gal(Object.keys(TYPES).filter(t => !(TYPES[t].once && present.has(t))).map(t => ({ t }))));
    h2(T.actions, body);
    body.appendChild(gal(ACTIONS.map(([a, label]) => ({ t: 'action', a, label }))));
    h2(T.link, body);
    const f = document.createElement('form');
    f.innerHTML = '<input type="url" inputmode="url" autocapitalize="off" autocorrect="off" placeholder="' + esc(T.url) + '">'
      + '<input type="text" maxlength="24" placeholder="' + esc(T.name) + '">'
      + '<button class="btn" style="height:48px;border-radius:24px;background:var(--accent);color:#fff;font-weight:600">' + esc(T.save) + '</button>';
    f.addEventListener('submit', e => {
      e.preventDefault();
      const [u, n] = f.querySelectorAll('input');
      let url = u.value.trim(); if (!url) return;
      if (!/^https?:\/\//i.test(url)) url = 'https://' + url;
      add({ t: 'url', url, label: n.value.trim() || url.replace(/^https?:\/\/(www\.)?/i, '').split('/')[0] });
    });
    body.appendChild(f);
    // Apps last: the list comes from the projector.
    const appsTitle = document.createElement('h2'); appsTitle.textContent = T.apps;
    body.insertBefore(appsTitle, body.children[2]);
    let apps = [];
    try { apps = await (await fetch('apps', { cache: 'no-store', headers: authHeaders() })).json(); } catch (e) { /* offline */ }
    const holder = apps.length ? gal(apps.map(a => ({ t: 'app', pkg: a.pkg, label: a.label })))
      : Object.assign(document.createElement('p'), { className: 'note', textContent: T.noApps });
    body.insertBefore(holder, appsTitle.nextSibling);
  }
  $('#pick-back').textContent = '‹ ' + T.back;
  $('#pick-back').addEventListener('click', () => document.body.classList.remove('pick-open'));

  // ---- layout sync and sizing
  function save() { render(); send('l:' + JSON.stringify(L)); }
  function apply(json) {
    try {
      const o = JSON.parse(json);
      L = o && o.v === 2 && Array.isArray(o.tiles) ? { v: 2, tiles: o.tiles.slice(0, 40) } : clone(DEFAULT);
    } catch (e) { return; }
    render();
  }
  function sleepAt(t) {
    sleepDeadline = t;
    render();
  }
  const fit = () => grid.style.setProperty('--cell', Math.floor((grid.clientWidth - 36) / 4) + 'px');
  window.addEventListener('resize', fit);
  setInterval(() => { if (sleepDeadline > Date.now() - 60000 && !editing) render(); }, 20000);
  fit(); render();
  return { apply, sleepAt };
})();

// ---------------------------------------------------------------- pairing
// The first time, the projector shows a 4-digit code; typing it here pairs this phone.
const pairing = (() => {
  const T = fr ? { title: 'Associer ce téléphone', sub: 'Saisis le code affiché sur le projecteur.', wrong: 'Code incorrect, réessaie.' }
               : { title: 'Pair this phone', sub: 'Type the code shown on the projector.', wrong: 'Wrong code, try again.' };
  $('#pin-title').textContent = T.title;
  $('#pin-sub').textContent = T.sub;
  const input = $('#pin');
  function ask() { document.body.classList.add('pairing'); input.value = ''; input.focus(); }
  function wrong() { ask(); $('#pin-sub').textContent = T.wrong; $('#pin-sub').classList.add('err'); }
  function ok() { document.body.classList.remove('pairing'); $('#pin-sub').textContent = T.sub; $('#pin-sub').classList.remove('err'); input.blur(); }
  input.addEventListener('input', () => {
    input.value = input.value.replace(/\D/g, '').slice(0, 4);
    if (input.value.length === 4 && ws && ws.readyState === 1) ws.send(helloMsg(input.value));
  });
  $('#pin-form').addEventListener('submit', e => e.preventDefault());
  return { ask, wrong, ok };
})();

// ---------------------------------------------------------------- remote theme
// Per phone: an accent colour and light, dark or automatic mode.
const theme = (() => {
  const ACCENTS = ['#0a84ff', '#bf5af2', '#ff375f', '#ff9f0a', '#30d158', '#64d2ff'];
  const T = fr ? { title: 'Thème', color: 'Couleur', mode: 'Apparence', modes: ['Auto', 'Sombre', 'Clair'], back: 'Retour' }
               : { title: 'Theme', color: 'Colour', mode: 'Appearance', modes: ['Auto', 'Dark', 'Light'], back: 'Back' };
  const MODES = ['', 'dark', 'light'];
  let t = { accent: '', mode: '' };
  try { t = Object.assign(t, JSON.parse(localStorage.getItem('udr-theme') || '{}')); } catch (e) { /* defaults */ }
  function apply() {
    const root = document.documentElement;
    if (t.mode) root.dataset.theme = t.mode; else delete root.dataset.theme;
    ['--accent', '--touch', '--rim', '--glow1'].forEach(v => root.style.removeProperty(v));
    if (t.accent) {
      const c = t.accent;
      root.style.setProperty('--accent', c);
      root.style.setProperty('--touch', c + '61');
      root.style.setProperty('--rim', c + '99');
      root.style.setProperty('--glow1', c + '33');
    }
    try { localStorage.setItem('udr-theme', JSON.stringify(t)); } catch (e) { /* ignore */ }
  }
  function open() {
    const body = $('#pick-body'); body.innerHTML = '';
    document.body.classList.add('pick-open');
    const h = txt => { const e = document.createElement('h2'); e.textContent = txt; body.appendChild(e); };
    h(T.color);
    const dots = document.createElement('div'); dots.className = 'dots';
    ACCENTS.forEach(c => {
      const b = document.createElement('button'); b.style.background = c; b.setAttribute('aria-label', c);
      b.classList.toggle('on', (t.accent || ACCENTS[0]) === c);
      b.addEventListener('click', () => { t.accent = c === ACCENTS[0] ? '' : c; apply(); open(); });
      dots.appendChild(b);
    });
    body.appendChild(dots);
    h(T.mode);
    const seg = document.createElement('div'); seg.className = 'seg';
    MODES.forEach((m, i) => {
      const b = document.createElement('button'); b.textContent = T.modes[i]; b.className = t.mode === m ? 'on' : '';
      b.addEventListener('click', () => { t.mode = m; apply(); open(); });
      seg.appendChild(b);
    });
    body.appendChild(seg);
  }
  $('#cc-theme').textContent = T.title;
  $('#cc-theme').addEventListener('click', open);
  apply();
  return { open };
})();

connect();
</script>
