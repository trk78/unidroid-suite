<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="UniDroid">
<meta name="application-name" content="UniDroid">
<meta name="description" content="Remote control and keyboard for your Android TV, box or projector.">
<meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
<meta name="theme-color" content="#f2f2f7" media="(prefers-color-scheme: light)">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="manifest" href="manifest.webmanifest">
<title>UniDroid Remote</title>
<style>
:root {
  --bg: #000; --fg: #f5f5f7; --dim: rgba(235,235,245,.55);
  --glass: rgba(255,255,255,.07); --glass-hi: rgba(255,255,255,.17);
  --edge: rgba(255,255,255,.13); --spec: rgba(255,255,255,.16);
  --shadow: 0 12px 32px rgba(0,0,0,.35);
  --field: rgba(118,118,128,.24);
  --accent: #0a84ff; --red: #ff453a; --green: #30d158; --orange: #ff9f0a;
  --glow1: rgba(10,132,255,.20); --glow2: rgba(191,90,242,.14); --touch: rgba(10,132,255,.38);
  --rim: rgba(120,180,255,.6);
  color-scheme: dark;
}
@media (prefers-color-scheme: light) {
  :root {
    --bg: #f2f2f7; --fg: #1d1d1f; --dim: rgba(60,60,67,.55);
    --glass: rgba(255,255,255,.6); --glass-hi: rgba(255,255,255,1);
    --edge: rgba(0,0,0,.07); --spec: rgba(255,255,255,.9);
    --shadow: 0 10px 28px rgba(0,0,0,.08);
    --field: rgba(118,118,128,.12);
    --accent: #007aff; --red: #ff3b30; --green: #34c759; --orange: #ff9500;
    --glow1: rgba(0,122,255,.13); --glow2: rgba(175,82,222,.10); --touch: rgba(0,122,255,.22);
    --rim: rgba(0,122,255,.45);
    color-scheme: light;
  }
}
@property --a { syntax: '<angle>'; inherits: false; initial-value: 0deg; }

* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; height: 100%; }
body {
  background: var(--bg);
  color: var(--fg);
  font: 17px/1.3 -apple-system, BlinkMacSystemFont, "SF Pro Text", system-ui, "Segoe UI", Roboto, sans-serif;
  letter-spacing: -.01em;
  -webkit-user-select: none; user-select: none; -webkit-touch-callout: none;
  overscroll-behavior: none; touch-action: manipulation;
  -webkit-font-smoothing: antialiased;
}

body::before {
  content: ""; position: fixed; inset: 0; z-index: -1; pointer-events: none;
  background:
    radial-gradient(70% 45% at 50% 34%, var(--glow1), transparent 70%),
    radial-gradient(55% 35% at 85% 100%, var(--glow2), transparent 70%);
}
.app {
  min-height: 100dvh; max-width: 440px; margin: 0 auto;
  display: flex; flex-direction: column; gap: 26px;
  padding: calc(env(safe-area-inset-top) + 14px) 22px calc(env(safe-area-inset-bottom) + 22px);
}

.glass {
  background: var(--glass);
  border: .5px solid var(--edge);
  box-shadow: inset 0 1px 0 var(--spec), var(--shadow);
  -webkit-backdrop-filter: blur(28px) saturate(170%);
  backdrop-filter: blur(28px) saturate(170%);
}
.i { width: 26px; height: 26px; display: block; pointer-events: none; }

/* ---------- header */
header { display: flex; align-items: center; gap: 10px; }
.install {
  display: none; align-items: center; gap: 12px; padding: 12px 14px; border-radius: 18px;
  font-size: 14px; line-height: 1.35; color: var(--fg);
}
body.browser .install { display: flex; }
.install svg { flex: none; width: 22px; height: 22px; color: var(--accent); }
.install b { font-weight: 600; }
.install .x { margin-left: auto; flex: none; width: 30px; height: 30px; border: 0; background: none; color: inherit; font-size: 20px; opacity: .6; }
.status {
  display: flex; align-items: center; gap: 8px; height: 38px; padding: 0 15px 0 13px;
  border-radius: 19px; font-size: 15px; font-weight: 600; margin-right: auto; min-width: 0;
}
.status #dev { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.dot { width: 8px; height: 8px; border-radius: 50%; flex: none; background: var(--orange); box-shadow: 0 0 10px var(--orange); transition: background .3s, box-shadow .3s; }
body[data-conn=online] .dot { background: var(--green); box-shadow: 0 0 10px var(--green); }
body[data-conn=offline] .dot { background: var(--red); box-shadow: 0 0 10px var(--red); }
body[data-conn=connecting] .dot { animation: breathe 1.2s ease-in-out infinite; }
#lat { color: var(--dim); font-weight: 500; font-variant-numeric: tabular-nums; }
@keyframes breathe { 50% { opacity: .3; } }

/* ---------- buttons */
.btn {
  appearance: none; border: 0; padding: 0; margin: 0; font: inherit; color: var(--fg);
  display: grid; place-items: center; cursor: pointer;
  transition: transform .45s cubic-bezier(.2,1.7,.35,1), background-color .25s;
}
.btn.pressed { transform: scale(.88); background-color: var(--glass-hi); transition-duration: .07s; }
.round { width: 68px; height: 68px; border-radius: 50%; justify-self: center; }
.small { width: 40px; height: 40px; border-radius: 50%; }
.small .i { width: 21px; height: 21px; }
.power { width: 52px; height: 52px; border-radius: 50%; color: var(--red); }
.power .i { width: 26px; height: 26px; }

/* ---------- touch pad */
.pad-wrap { flex: 1; display: grid; place-items: center; }
.pad {
  position: relative; width: min(80vw, 320px, 44dvh); aspect-ratio: 1; border-radius: 50%;
  touch-action: none; overflow: hidden; cursor: pointer;
}
.pad::before {
  content: ""; position: absolute; inset: 0; border-radius: 50%; padding: 1.3px;
  background: conic-gradient(from var(--a), transparent 0 50%, var(--rim) 72%, transparent 94%);
  -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
  -webkit-mask-composite: xor; mask-composite: exclude;
  animation: spin 9s linear infinite; pointer-events: none;
}
body[data-conn=offline] .pad::before { animation-play-state: paused; opacity: .25; }
.pad::after {
  content: ""; position: absolute; inset: 0; pointer-events: none; opacity: 0;
  background: radial-gradient(circle 95px at var(--x, 50%) var(--y, 50%), var(--touch), transparent 70%);
  transition: opacity .35s;
}
.pad.touch::after { opacity: 1; transition-duration: .05s; }
.pad .ok {
  position: absolute; inset: 31%; border-radius: 50%;
  border: .5px solid var(--edge); background: var(--glass);
  box-shadow: inset 0 1px 0 var(--spec);
  transition: transform .45s cubic-bezier(.2,1.7,.35,1), background-color .25s;
}
.pad .chev { position: absolute; width: 22px; height: 22px; color: var(--dim); transition: color .3s; }
.chev[data-z=UP]    { top: 9%;    left: calc(50% - 11px); }
.chev[data-z=DOWN]  { bottom: 9%; left: calc(50% - 11px); }
.chev[data-z=LEFT]  { left: 9%;   top: calc(50% - 11px); }
.chev[data-z=RIGHT] { right: 9%;  top: calc(50% - 11px); }
.chev.on { color: var(--accent); animation: blip .28s ease-out; transition-duration: 0s; }
.ok.on { transform: scale(.92); background-color: var(--glass-hi); transition-duration: .07s; }
@keyframes blip { 40% { transform: scale(1.35); } }
@keyframes spin { to { --a: 360deg; } }

/* ---------- controls: blocks the user can reorder or hide */
.controls { flex: 1; display: flex; flex-direction: column; gap: 18px; }
.row3 { display: grid; grid-template-columns: repeat(3, 1fr); }
.block.off { display: none; }
.status { cursor: pointer; }
.status .i { width: 15px; height: 15px; color: var(--dim); flex: none; }
.custom { display: grid; grid-template-columns: repeat(4, 1fr); row-gap: 14px; }
.custom:empty { display: none; }
.cbtn { display: flex; flex-direction: column; align-items: center; gap: 6px; min-width: 0; }
.cbtn .btn { width: 58px; height: 58px; border-radius: 50%; }
.cbtn .btn img { width: 34px; height: 34px; border-radius: 9px; pointer-events: none; }
.cbtn .btn .k { font-size: 14px; font-weight: 700; pointer-events: none; }
.cbtn span { font-size: 11.5px; color: var(--dim); max-width: 100%; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

/* ---------- editor */
body.edit-open #edit, body.pick-open #pick { display: flex; }
.edit .row, .pick .row { cursor: pointer; }
.edit .row .ic { width: 36px; height: 36px; border-radius: 50%; flex: none; display: grid; place-items: center; background: var(--glass-hi); }
.edit .row .ic img { width: 24px; height: 24px; border-radius: 6px; }
.edit .row .ic .i, .pick .row .i { width: 20px; height: 20px; }
.edit .mv { width: 36px; height: 36px; border-radius: 50%; flex: none; border: 0; background: var(--glass); color: var(--fg); font-size: 18px; }
.edit .mv:disabled { opacity: .25; }
.edit .add { height: 52px; border-radius: 26px; font-weight: 600; color: var(--accent); }
.switch { width: 50px; height: 30px; border-radius: 15px; background: var(--field); position: relative; flex: none; transition: background .2s; }
.switch::after { content: ""; position: absolute; top: 2px; left: 2px; width: 26px; height: 26px; border-radius: 50%; background: #fff; box-shadow: 0 2px 6px rgba(0,0,0,.3); transition: transform .2s; }
.on > .switch { background: var(--green); }
.on > .switch::after { transform: translateX(20px); }
.seg { display: flex; gap: 6px; padding: 4px; border-radius: 14px; background: var(--field); }
.seg button { flex: 1; height: 36px; border: 0; border-radius: 10px; background: none; color: var(--fg); font: inherit; font-size: 14px; font-weight: 600; }
.seg button.on { background: var(--glass-hi); }
.pick .grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px 8px; padding-top: 6px; }
.pick .grid .cbtn { cursor: pointer; }
.pick form { display: flex; flex-direction: column; gap: 10px; }
.pick input { height: 48px; border-radius: 14px; border: 0; padding: 0 14px; background: var(--field); color: var(--fg); font: inherit; }
.pick .note { color: var(--dim); font-size: 14px; text-align: center; padding: 20px; }
.pill {
  grid-column: span 2; display: flex; align-items: center; justify-content: space-between;
  height: 68px; border-radius: 34px; padding: 0 6px;
  /* Columns are half of this area; round buttons (68px) sit centred in them. */
  margin: 0 calc(25% - 34px);
}
.pill .btn { width: 56px; height: 56px; border-radius: 50%; background: transparent; }
.pill .btn.pressed { background: var(--glass-hi); }
.vol-label { font-size: 13px; font-weight: 600; color: var(--dim); letter-spacing: .02em; }

/* ---------- keyboard sheet */
.sheet {
  position: fixed; left: 12px; right: 12px; bottom: calc(var(--kb, 0px) + 12px); z-index: 10;
  max-width: 520px; margin: 0 auto; padding: 10px; border-radius: 28px;
  display: flex; gap: 8px; align-items: center;
  transform: translateY(calc(100% + 60px)); opacity: 0; pointer-events: none;
  transition: transform .5s cubic-bezier(.2,1.15,.3,1), opacity .25s;
}
body.typing .sheet { transform: none; opacity: 1; pointer-events: auto; }
.sheet input {
  flex: 1; min-width: 0; height: 44px; border: 0; border-radius: 22px; padding: 0 16px;
  font: inherit; font-size: 17px; color: var(--fg); background: var(--field); outline: none;
  -webkit-user-select: text; user-select: text;
}
.sheet input::placeholder { color: var(--dim); }
.sheet .btn { width: 44px; height: 44px; border-radius: 50%; flex: none; background: var(--field); }
.sheet .btn .i { width: 21px; height: 21px; }
.sheet .done { background: var(--accent); color: #fff; }

/* ---------- web mode: the projector shows the page, the phone holds the browser */
#web { display: none; }
body.web .app { display: none; }
body.web #web {
  display: flex; flex-direction: column; gap: 14px; min-height: 100dvh; max-width: 520px; margin: 0 auto;
  padding: calc(env(safe-area-inset-top) + 14px) 16px calc(env(safe-area-inset-bottom) + 16px);
}
#web header { gap: 8px; }
.addr { position: relative; flex: 1; min-width: 0; display: flex; align-items: center; height: 44px; border-radius: 22px; padding: 0 6px 0 16px; overflow: hidden; }
.addr input {
  flex: 1; min-width: 0; height: 100%; border: 0; background: none; outline: none; color: var(--fg);
  font: inherit; font-size: 16px; -webkit-user-select: text; user-select: text;
}
.addr input::placeholder { color: var(--dim); }
.addr .bar { position: absolute; left: 0; bottom: 0; height: 2.5px; background: var(--accent); width: 0; transition: width .3s, opacity .4s; }
.addr .btn { width: 34px; height: 34px; border-radius: 50%; flex: none; }
.addr .btn .i { width: 19px; height: 19px; }
.webbar { display: flex; justify-content: space-between; gap: 6px; }
.webbar .btn { width: 52px; height: 46px; border-radius: 23px; position: relative; }
.webbar .btn .i { width: 22px; height: 22px; }
.webbar .btn:disabled { opacity: .3; }
.webbar .btn.on { color: var(--accent); }
.count {
  position: absolute; inset: 0; display: grid; place-items: center; font-size: 12px; font-weight: 700;
  pointer-events: none;
}
.track {
  flex: 1; min-height: 240px; border-radius: 30px; position: relative; touch-action: none; overflow: hidden;
  display: grid; place-items: center; color: var(--dim); font-size: 14px; text-align: center; line-height: 1.5;
}
.track .hint { pointer-events: none; padding: 0 56px 0 30px; transition: opacity .4s; }
.track.used .hint { opacity: 0; }
.track::after {
  content: ""; position: absolute; inset: 0; pointer-events: none; opacity: 0;
  background: radial-gradient(circle 80px at var(--x, 50%) var(--y, 50%), var(--touch), transparent 70%);
  transition: opacity .35s;
}
.track.touch::after { opacity: 1; transition-duration: .05s; }
.track .strip { position: absolute; top: 14px; bottom: 14px; right: 8px; width: 34px; border-radius: 17px; background: var(--field); }
.track .strip::before { content: "⇅"; position: absolute; inset: 0; display: grid; place-items: center; font-size: 15px; color: var(--dim); }
.webkeys { display: flex; justify-content: space-between; gap: 8px; }
.webkeys .btn { flex: 1; height: 54px; border-radius: 27px; font-size: 15px; font-weight: 600; }
.closed-note { display: none; text-align: center; color: var(--dim); font-size: 14px; }
body.web-closed .closed-note { display: block; }
.tabs {
  position: fixed; inset: 0; z-index: 20; display: none; flex-direction: column; gap: 10px;
  padding: calc(env(safe-area-inset-top) + 16px) 16px calc(env(safe-area-inset-bottom) + 16px);
  background: var(--bg); overflow-y: auto;
}
body.tabs-open .tabs { display: flex; }
.tabs h2 { margin: 6px 4px 0; font-size: 13px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; color: var(--dim); }
.tabs .row { display: flex; align-items: center; gap: 10px; min-height: 58px; padding: 8px 8px 8px 16px; border-radius: 18px; }
.tabs .row.active { outline: 2px solid var(--accent); }
.tabs .row .t { flex: 1; min-width: 0; }
.tabs .row b, .tabs .row small { display: block; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.tabs .row b { font-size: 15px; font-weight: 600; }
.tabs .row small { font-size: 12.5px; color: var(--dim); margin-top: 2px; }
.tabs .row .x { width: 36px; height: 36px; border-radius: 50%; flex: none; font-size: 20px; color: var(--dim); background: none; }
.tabs .top { display: flex; gap: 10px; }
.tabs .top .btn { flex: 1; height: 48px; border-radius: 24px; font-weight: 600; }
.tabs .top .btn.primary { background: var(--accent); color: #fff; border: 0; }

/* ---------- landscape / tablets */
@media (orientation: landscape) and (min-width: 600px) {
  .app { max-width: 900px; display: grid; grid-template-columns: 1fr 1fr; grid-template-rows: auto 1fr; column-gap: 48px; }
  header { grid-column: 1 / -1; }
  .pad { width: min(42vw, 70dvh, 380px); }
  .controls { align-self: center; display: grid; grid-template-columns: 1fr 1fr; column-gap: 32px; }
  .controls { grid-column: 1 / -1; }
  .controls .pad-wrap { grid-row: span 4; }
}
@media (prefers-reduced-motion: reduce) {
  *, .pad::before { animation: none !important; transition-duration: 0s !important; }
}
</style>
</head>

<script>
'use strict';
const $ = s => document.querySelector(s);
const KEY = { UP: 19, DOWN: 20, LEFT: 21, RIGHT: 22, OK: 23 };

// ---------------------------------------------------------------- identity
// A random id kept on this phone, and whether the remote runs from the home screen:
// the TV shows a QR code until one device has added the remote to its home screen.
const installed = navigator.standalone === true || matchMedia('(display-mode: standalone)').matches;
let deviceId = '';
try {
  deviceId = localStorage.getItem('udr-id') || '';
  if (!/^[A-Za-z0-9-]{8,64}$/.test(deviceId)) {
    deviceId = (crypto.randomUUID ? crypto.randomUUID() : Date.now().toString(36) + Math.random().toString(36).slice(2, 12));
    localStorage.setItem('udr-id', deviceId);
  }
} catch (e) { deviceId = 'session-' + Math.random().toString(36).slice(2, 12); }
const ua = navigator.userAgent;
const deviceName = /iPhone/.test(ua) ? 'iPhone' : /iPad/.test(ua) || (/Macintosh/.test(ua) && navigator.maxTouchPoints > 1) ? 'iPad'
  : /Android/.test(ua) ? 'Android' : /Macintosh/.test(ua) ? 'Mac' : /Windows/.test(ua) ? 'PC' : 'Browser';

// Until it is installed: how to add it to the home screen (iOS: Share, then Add to Home Screen).
const fr = (navigator.language || '').toLowerCase().startsWith('fr');
let hintClosed = false;
try { hintClosed = sessionStorage.getItem('udr-hint') === '0'; } catch (e) { /* ignore */ }
if (!installed && !hintClosed) {
  document.body.classList.add('browser');
  const ios = deviceName === 'iPhone' || deviceName === 'iPad';
  $('#install-text').innerHTML = ios
    ? (fr ? 'Garde la télécommande : <b>Partager</b> › <b>Sur l’écran d’accueil</b>'
          : 'Keep the remote: <b>Share</b> › <b>Add to Home Screen</b>')
    : (fr ? 'Garde la télécommande : menu du navigateur › <b>Installer</b> ou <b>Ajouter à l’écran d’accueil</b>'
          : 'Keep the remote: browser menu › <b>Install</b> or <b>Add to Home screen</b>');
  $('#install-close').addEventListener('click', () => {
    document.body.classList.remove('browser');
    try { sessionStorage.setItem('udr-hint', '0'); } catch (e) { /* ignore */ }
  });
}

// ---------------------------------------------------------------- connection
let ws = null, retry = 0, pingAt = 0, retryTimer = 0;

function connect() {
  clearTimeout(retryTimer);
  document.body.dataset.conn = 'connecting';
  try {
    ws = new WebSocket((location.protocol === 'https:' ? 'wss://' : 'ws://') + location.host + '/ws');
  } catch (e) { return reconnectLater(); }
  ws.onopen = () => {
    retry = 0;
    document.body.dataset.conn = 'online';
    ws.send('h:' + deviceId + '\t' + (installed ? 1 : 0) + '\t' + deviceName);
    if (document.body.classList.contains('web')) ws.send('w:state');
    ping();
  };
  ws.onmessage = e => {
    if (e.data.startsWith('w:')) { web.state(e.data.slice(2)); return; }
    if (e.data.startsWith('l:')) { custom.apply(e.data.slice(2)); return; }
    if (e.data === 'p') {
      $('#lat').textContent = Math.max(1, Math.round(performance.now() - pingAt)) + ' ms';
    } else if (e.data.startsWith('i:')) {
      try {
        const info = JSON.parse(e.data.slice(2));
        // A new version of the app was installed: load its page (an open home-screen app keeps the old one).
        if (info.page && pageId && info.page !== pageId) { location.reload(); return; }
        pageId = info.page;
        $('#dev').textContent = info.name || 'Android';
        document.title = (info.name || 'Android') + ' · Remote';
      } catch (err) { /* ignore */ }
    }
  };
  ws.onclose = () => { ws = null; document.body.dataset.conn = 'offline'; $('#lat').textContent = ''; reconnectLater(); };
  ws.onerror = () => { try { ws.close(); } catch (err) { /* ignore */ } };
}
function reconnectLater() {
  clearTimeout(retryTimer);
  retryTimer = setTimeout(connect, Math.min(4000, 250 * 2 ** retry++));
}
function ping() {
  if (ws && ws.readyState === 1) { pingAt = performance.now(); ws.send('p'); }
}
setInterval(() => { if (!document.hidden) ping(); }, 5000);
document.addEventListener('visibilitychange', () => {
  if (!document.hidden && (!ws || ws.readyState > 1)) { retry = 0; connect(); }
});

// WebSocket first; plain HTTP as a fallback (no hold/repeat there).
let pageId = null;
function send(msg) {
  if (ws && ws.readyState === 1) { ws.send(msg); return; }
  const type = msg[0], arg = msg.slice(2);
  if (type === 'k' || type === 'u') fetch('/key?k=' + arg).catch(() => {});
  else if (type === 't') fetch('/text?t=' + encodeURIComponent(arg)).catch(() => {});
  else if (type === 'b') for (let i = 0; i < +arg; i++) fetch('/key?k=67').catch(() => {});
  else if (type === 'a') fetch('/action?a=' + encodeURIComponent(arg)).catch(() => {});
}

// ---------------------------------------------------------------- haptics
// iOS Safari has no vibrate(); toggling a native switch gives a light tap (iOS 18+).
const hapticSwitch = (() => {
  const label = document.createElement('label');
  const input = document.createElement('input');
  input.type = 'checkbox'; input.setAttribute('switch', '');
  label.appendChild(input);
  label.style.cssText = 'position:fixed;opacity:0;pointer-events:none;width:0;height:0;overflow:hidden';
  document.body.appendChild(label);
  return label;
})();
function hapticsOn() {
  try { return localStorage.getItem('udr-haptics') !== 'off'; } catch (e) { return true; }
}
function haptic() {
  if (!hapticsOn()) return;
  if (navigator.vibrate) navigator.vibrate(8); else hapticSwitch.click();
}

// ---------------------------------------------------------------- buttons
// Press = key down, release = key up: holding a button repeats like a real remote.
const noDefault = e => e.preventDefault();
document.querySelectorAll('[data-key]').forEach(btn => {
  const code = btn.dataset.key;
  let held = false;
  btn.addEventListener('touchstart', noDefault, { passive: false });
  btn.addEventListener('pointerdown', e => {
    e.preventDefault();
    // The keyboard sheet's Delete and Enter type into the page while the browser is open.
    if (inWeb() && (code === '67' || code === '66')) {
      haptic();
      if (code === '66') { pressEnter(); field.value = ''; mirrored = []; return; }
      const chars = [...field.value];
      if (chars.length) { chars.pop(); field.value = chars.join(''); mirrored = chars; }
      deleteChars(1);
      return;
    }
    btn.setPointerCapture(e.pointerId);
    held = true;
    btn.classList.add('pressed');
    haptic();
    send('d:' + code);
  });
  const release = () => {
    if (!held) return;
    held = false;
    btn.classList.remove('pressed');
    send('u:' + code);
  };
  btn.addEventListener('pointerup', release);
  btn.addEventListener('pointercancel', release);
  btn.addEventListener('lostpointercapture', release);
});

// Actions (open a screen, launch an app) fire once, on release.
document.querySelectorAll('[data-action]').forEach(btn => {
  btn.addEventListener('touchstart', noDefault, { passive: false });
  btn.addEventListener('pointerdown', e => {
    e.preventDefault();
    btn.classList.add('pressed');
    haptic();
  });
  btn.addEventListener('pointerup', () => {
    if (!btn.classList.contains('pressed')) return;
    btn.classList.remove('pressed');
    send('a:' + btn.dataset.action);
  });
  btn.addEventListener('pointerleave', () => btn.classList.remove('pressed'));
  btn.addEventListener('pointercancel', () => btn.classList.remove('pressed'));
});

// ---------------------------------------------------------------- touch pad
// Tap: direction by zone (centre = OK). Swipe: one step every 34 px. Hold: key repeat.
const pad = $('#pad');
const STEP = 34, HOLD_MS = 320, DEAD_PX = 10;
let gesture = null;

function zoneAt(x, y) {
  const r = pad.getBoundingClientRect();
  const dx = x - (r.left + r.width / 2), dy = y - (r.top + r.height / 2);
  if (Math.hypot(dx, dy) < r.width * 0.19) return 'OK';
  return Math.abs(dx) > Math.abs(dy) ? (dx > 0 ? 'RIGHT' : 'LEFT') : (dy > 0 ? 'DOWN' : 'UP');
}
function glowAt(x, y) {
  const r = pad.getBoundingClientRect();
  pad.style.setProperty('--x', (x - r.left) + 'px');
  pad.style.setProperty('--y', (y - r.top) + 'px');
}
function flash(zone) {
  const el = zone === 'OK' ? pad.querySelector('.ok') : pad.querySelector('[data-z=' + zone + ']');
  el.classList.remove('on');
  void el.getBoundingClientRect();
  el.classList.add('on');
  clearTimeout(el._t);
  el._t = setTimeout(() => el.classList.remove('on'), 280);
}

pad.addEventListener('touchstart', noDefault, { passive: false });
pad.addEventListener('pointerdown', e => {
  e.preventDefault();
  pad.setPointerCapture(e.pointerId);
  pad.classList.add('touch');
  glowAt(e.clientX, e.clientY);
  haptic();
  const g = gesture = { x: e.clientX, y: e.clientY, acc: 0, axis: null, mode: 'pending', zone: zoneAt(e.clientX, e.clientY) };
  g.timer = setTimeout(() => {
    if (g.mode !== 'pending') return;
    g.mode = 'hold';
    flash(g.zone);
    send('d:' + KEY[g.zone]);
  }, HOLD_MS);
});
pad.addEventListener('pointermove', e => {
  const g = gesture;
  if (!g) return;
  glowAt(e.clientX, e.clientY);
  const dx = e.clientX - g.x, dy = e.clientY - g.y;
  if (g.mode === 'pending') {
    if (Math.hypot(dx, dy) < DEAD_PX) return;
    clearTimeout(g.timer);
    g.mode = 'swipe';
    g.axis = Math.abs(dx) > Math.abs(dy) ? 'x' : 'y';
  }
  if (g.mode !== 'swipe') return;
  g.acc += g.axis === 'x' ? dx : dy;
  g.x = e.clientX; g.y = e.clientY;
  while (Math.abs(g.acc) >= STEP) {
    const zone = g.axis === 'x' ? (g.acc > 0 ? 'RIGHT' : 'LEFT') : (g.acc > 0 ? 'DOWN' : 'UP');
    send('k:' + KEY[zone]);
    flash(zone);
    g.acc -= Math.sign(g.acc) * STEP;
  }
});
function endGesture() {
  const g = gesture;
  if (!g) return;
  gesture = null;
  clearTimeout(g.timer);
  pad.classList.remove('touch');
  if (g.mode === 'pending') { send('k:' + KEY[g.zone]); flash(g.zone); }
  else if (g.mode === 'hold') send('u:' + KEY[g.zone]);
}
pad.addEventListener('pointerup', endGesture);
pad.addEventListener('pointercancel', endGesture);

// ---------------------------------------------------------------- keyboard
// Live typing: every change in the field is mirrored on the TV (backspaces + new text).
// With the browser open, text goes straight into the page instead of as key strokes.
const field = $('#text');
let mirrored = [];
function inWeb() { return document.body.classList.contains('web'); }
const typeText = t => send(inWeb() ? 'w:type ' + t : 't:' + t);
const deleteChars = n => send(inWeb() ? 'w:del ' + n : 'b:' + n);
const pressEnter = () => send(inWeb() ? 'w:enter' : 'k:66');

function openKeyboard() {
  field.value = ''; mirrored = [];
  document.body.classList.add('typing');
  field.focus();
}
function closeKeyboard() {
  document.body.classList.remove('typing');
  field.blur();
}
$('#kb-open').addEventListener('click', openKeyboard);
$('#kb-close').addEventListener('click', closeKeyboard);
field.addEventListener('blur', () => setTimeout(() => {
  if (document.activeElement !== field) document.body.classList.remove('typing');
}, 150));
field.addEventListener('input', () => {
  const now = [...field.value];
  let same = 0;
  while (same < mirrored.length && same < now.length && mirrored[same] === now[same]) same++;
  const removed = mirrored.length - same;
  if (removed > 0) deleteChars(removed);
  if (now.length > same) typeText(now.slice(same).join(''));
  mirrored = now;
});
field.addEventListener('keydown', e => {
  if (e.key === 'Enter') { e.preventDefault(); pressEnter(); field.value = ''; mirrored = []; }
  else if (e.key === 'Backspace' && field.value === '') deleteChars(1);
});

// Keep the sheet above the on-screen keyboard.
if (window.visualViewport) {
  const vv = window.visualViewport;
  const place = () => document.documentElement.style.setProperty(
    '--kb', Math.max(0, window.innerHeight - vv.height - vv.offsetTop) + 'px');
  vv.addEventListener('resize', place);
  vv.addEventListener('scroll', place);
}

// ---------------------------------------------------------------- desktop keys
const DESKTOP = { ArrowUp: 19, ArrowDown: 20, ArrowLeft: 21, ArrowRight: 22, Enter: 23,
  Escape: 4, Backspace: 4, ' ': 85, h: 3, '+': 24, '-': 25 };
// Arrow keys and Enter on a computer keyboard drive the TV, except while typing in a field.
const typingIn = e => e.target instanceof HTMLInputElement || e.target instanceof HTMLTextAreaElement;
document.addEventListener('keydown', e => {
  if (typingIn(e) || e.metaKey || e.ctrlKey || e.altKey) return;
  const code = DESKTOP[e.key];
  if (code === undefined) return;
  e.preventDefault();
  if (!e.repeat) send('d:' + code);
});
document.addEventListener('keyup', e => {
  if (typingIn(e)) return;
  const code = DESKTOP[e.key];
  if (code !== undefined) send('u:' + code);
});

// ---------------------------------------------------------------- web mode
// The projector only shows the page and a pointer; this screen holds the address bar,
// tabs, bookmarks and a track pad. Commands go to the browser as "w:" messages.
const web = (() => {
  const T = fr ? {
    addr: 'Rechercher ou saisir une adresse', hint: 'Glisse pour bouger le pointeur · Touche pour cliquer<br>Deux doigts ou la bande de droite pour faire défiler',
    closed: 'Navigateur fermé : tape une adresse pour le rouvrir.', tabs: 'Onglets', marks: 'Favoris', none: 'Aucun favori : touche ★ sur une page.',
    done: 'OK', new: 'Nouvel onglet', blank: 'Nouvel onglet', saved: 'Ajouté aux favoris', removed: 'Retiré des favoris'
  } : {
    addr: 'Search or type an address', hint: 'Slide to move the pointer · Tap to click<br>Two fingers or the right strip to scroll',
    closed: 'Browser closed: type an address to open it again.', tabs: 'Tabs', marks: 'Bookmarks', none: 'No bookmark yet: tap ★ on a page.',
    done: 'Done', new: 'New tab', blank: 'New tab', saved: 'Bookmarked', removed: 'Bookmark removed'
  };
  $('#addr').placeholder = T.addr;
  $('#track-hint').innerHTML = T.hint;
  $('#closed-note').textContent = T.closed;
  $('#tabs-title').textContent = T.tabs;
  $('#marks-title').textContent = T.marks;
  $('#tabs-done').textContent = T.done;
  $('#tabs-new').textContent = T.new;

  let st = { tabs: [], back: false, forward: false, progress: 100, desktop: true };
  const cmd = c => send('w:' + c);
  const current = () => st.tabs.find(t => t.active) || {};

  // ---- bookmarks, kept on this phone
  const marks = () => { try { return JSON.parse(localStorage.getItem('udr-marks') || '[]'); } catch (e) { return []; } };
  const saveMarks = m => { try { localStorage.setItem('udr-marks', JSON.stringify(m)); } catch (e) { /* ignore */ } };
  function toggleMark() {
    const c = current(); if (!c.url) return;
    const m = marks(); const i = m.findIndex(x => x.url === c.url);
    if (i >= 0) m.splice(i, 1); else m.unshift({ url: c.url, title: c.title || c.url });
    saveMarks(m); paint(); haptic();
  }

  function paint() {
    const c = current();
    if (document.activeElement !== $('#addr')) $('#addr').value = c.url || '';
    $('#w-back').disabled = !st.back;
    $('#w-forward').disabled = !st.forward;
    $('#w-count').textContent = st.tabs.length || 1;
    $('#w-desktop').classList.toggle('on', !!st.desktop);
    $('#w-star').classList.toggle('on', !!c.url && marks().some(x => x.url === c.url));
    const bar = $('#bar');
    bar.style.width = (st.progress >= 100 ? 100 : Math.max(8, st.progress)) + '%';
    bar.style.opacity = st.progress >= 100 ? 0 : 1;
    // tab sheet
    const list = $('#tab-list'); list.innerHTML = '';
    st.tabs.forEach(t => {
      const row = document.createElement('div'); row.className = 'row glass' + (t.active ? ' active' : '');
      row.innerHTML = '<span class="t"><b></b><small></small></span><button class="btn x" aria-label="Close">×</button>';
      row.querySelector('b').textContent = t.title || T.blank;
      row.querySelector('small').textContent = t.url || '';
      row.addEventListener('click', e => { if (e.target.closest('.x')) return; cmd('tab ' + t.id); closeTabs(); });
      row.querySelector('.x').addEventListener('click', () => cmd('close ' + t.id));
      list.appendChild(row);
    });
    const ml = $('#mark-list'); ml.innerHTML = '';
    const m = marks();
    if (!m.length) { const p = document.createElement('p'); p.className = 'closed-note'; p.style.display = 'block'; p.textContent = T.none; ml.appendChild(p); }
    m.forEach(b => {
      const row = document.createElement('div'); row.className = 'row glass';
      row.innerHTML = '<span class="t"><b></b><small></small></span><button class="btn x" aria-label="Remove">×</button>';
      row.querySelector('b').textContent = b.title;
      row.querySelector('small').textContent = b.url;
      row.addEventListener('click', e => { if (e.target.closest('.x')) return; cmd('open ' + b.url); closeTabs(); });
      row.querySelector('.x').addEventListener('click', () => { saveMarks(marks().filter(x => x.url !== b.url)); paint(); });
      ml.appendChild(row);
    });
  }

  function state(json) {
    try {
      const o = JSON.parse(json);
      if (o.closed) {
        document.body.classList.add('web-closed');
        if (browserOpen) { browserOpen = false; close(); }
        return;
      }
      if (!browserOpen) { browserOpen = true; if (!document.body.classList.contains('web')) show(); }
      document.body.classList.remove('web-closed');
      st = o; paint();
    } catch (e) { /* ignore */ }
  }

  // The browser is opened from the projector (Browser tile); its controls then appear here.
  let browserOpen = false;
  function show() {
    document.body.classList.add('web');
    try { sessionStorage.setItem('udr-mode', 'web'); } catch (e) { /* ignore */ }
    paint();
  }
  function open() {
    document.body.classList.add('web');
    try { sessionStorage.setItem('udr-mode', 'web'); } catch (e) { /* ignore */ }
    cmd('show'); cmd('state'); paint();
  }
  function close() {
    document.body.classList.remove('web');
    try { sessionStorage.setItem('udr-mode', 'remote'); } catch (e) { /* ignore */ }
  }
  const openTabs = () => { paint(); document.body.classList.add('tabs-open'); };
  const closeTabs = () => document.body.classList.remove('tabs-open');

  $('#web-remote').addEventListener('click', close);
  const go = () => {
    const v = $('#addr').value.trim();
    if (v) { cmd('open ' + v); $('#addr').blur(); }
  };
  $('#addr-form').addEventListener('submit', e => { e.preventDefault(); go(); });
  // iOS does not always submit a form without a submit button: handle Go directly.
  $('#addr').addEventListener('keydown', e => {
    if (e.key === 'Enter' && !e.isComposing) { e.preventDefault(); go(); }
  });
  $('#addr').addEventListener('focus', () => $('#addr').select());
  $('#w-reload').addEventListener('click', () => cmd(st.progress < 100 ? 'stop' : 'reload'));
  $('#w-back').addEventListener('click', () => cmd('back'));
  $('#w-forward').addEventListener('click', () => cmd('forward'));
  $('#w-tabs').addEventListener('click', openTabs);
  $('#w-star').addEventListener('click', toggleMark);
  $('#w-desktop').addEventListener('click', () => cmd('mode ' + (st.desktop ? 'mobile' : 'desktop')));
  $('#w-exit').addEventListener('click', () => { cmd('exit'); close(); });
  $('#w-zoom-in').addEventListener('click', () => cmd('zoom in'));
  $('#w-zoom-out').addEventListener('click', () => cmd('zoom out'));
  $('#w-kb').addEventListener('click', openKeyboard);
  $('#tabs-done').addEventListener('click', closeTabs);
  $('#tabs-new').addEventListener('click', () => { cmd('new'); closeTabs(); $('#addr').focus(); });

  // ---- track pad: one finger moves the pointer, a tap clicks, two fingers (or the strip) scroll
  const track = $('#track'), strip = $('#strip');
  const pts = new Map();
  let moved = 0, downAt = 0, mode = 'move', pend = { mx: 0, my: 0, sx: 0, sy: 0 }, frame = 0;
  function flush() {
    frame = 0;
    if (pend.mx || pend.my) cmd('move ' + pend.mx.toFixed(1) + ' ' + pend.my.toFixed(1));
    if (pend.sx || pend.sy) cmd('scroll ' + pend.sx.toFixed(1) + ' ' + pend.sy.toFixed(1));
    pend = { mx: 0, my: 0, sx: 0, sy: 0 };
  }
  const queue = () => { if (!frame) frame = requestAnimationFrame(flush); };
  track.addEventListener('touchstart', noDefault, { passive: false });
  track.addEventListener('pointerdown', e => {
    e.preventDefault();
    track.setPointerCapture(e.pointerId);
    track.classList.add('touch', 'used');
    pts.set(e.pointerId, { x: e.clientX, y: e.clientY });
    if (pts.size === 1) {
      moved = 0; downAt = performance.now();
      mode = e.target === strip ? 'strip' : 'move';
    } else {
      mode = 'scroll';
    }
  });
  track.addEventListener('pointermove', e => {
    const p = pts.get(e.pointerId); if (!p) return;
    const r = track.getBoundingClientRect();
    track.style.setProperty('--x', (e.clientX - r.left) + 'px');
    track.style.setProperty('--y', (e.clientY - r.top) + 'px');
    const dx = e.clientX - p.x, dy = e.clientY - p.y;
    p.x = e.clientX; p.y = e.clientY;
    moved += Math.abs(dx) + Math.abs(dy);
    if (mode === 'move') {
      // Faster swipes travel further, like a laptop track pad.
      const gain = 1.5 + Math.min(2.5, Math.hypot(dx, dy) / 10);
      pend.mx += dx * gain; pend.my += dy * gain;
    } else if (mode === 'strip') {
      pend.sy += dy * 3;
    } else {
      pend.sx += dx * 1.5 / pts.size; pend.sy += dy * 1.5 / pts.size;
    }
    queue();
  });
  function up(e) {
    if (!pts.has(e.pointerId)) return;
    pts.delete(e.pointerId);
    if (pts.size) return;
    track.classList.remove('touch');
    if (mode === 'move' && moved < 8 && performance.now() - downAt < 300) { flush(); cmd('click'); haptic(); }
    mode = 'move';
  }
  track.addEventListener('pointerup', up);
  track.addEventListener('pointercancel', up);

  try { if (sessionStorage.getItem('udr-mode') === 'web') setTimeout(open, 300); } catch (e) { /* ignore */ }
  return { state };
})();

// ---------------------------------------------------------------- customisation
// Like Control Center: blocks can be reordered or hidden, and custom buttons launch an
// app of the projector, a UniDroid screen, an Android key or a web page. The layout lives
// on the projector ("l:" messages), so every phone shows the same remote.
const custom = (() => {
  const T = fr ? {
    done: 'OK', reset: 'Réinitialiser', layout: 'Disposition', buttons: 'Boutons personnalisés', add: 'Ajouter un bouton',
    feedback: 'Téléphone', haptics: 'Vibrations', hapticsSub: 'Un léger tap à chaque appui (iPhone : iOS 18 ou plus)',
    back: 'Retour', apps: 'Applis', actions: 'Actions', keys: 'Touches', link: 'Lien',
    noApps: 'Ouvre l\u2019accueil UniDroid sur le projecteur une fois pour publier la liste des applis.',
    url: 'Adresse (https://…)', name: 'Nom du bouton', save: 'Ajouter', none: 'Aucun bouton : ajoute tes applis et actions préférées.',
    blocks: { pad: 'Pavé tactile', nav: 'Retour · Accueil · Applis', media: 'Lecture', volume: 'Volume · Clavier', custom: 'Boutons personnalisés' }
  } : {
    done: 'Done', reset: 'Reset', layout: 'Layout', buttons: 'Custom buttons', add: 'Add a button',
    feedback: 'Phone', haptics: 'Haptics', hapticsSub: 'A light tap on every press (iPhone: iOS 18 or later)',
    back: 'Back', apps: 'Apps', actions: 'Actions', keys: 'Keys', link: 'Link',
    noApps: 'Open the UniDroid home screen on the projector once to publish the app list.',
    url: 'Address (https://…)', name: 'Button name', save: 'Add', none: 'No button yet: add your favourite apps and actions.',
    blocks: { pad: 'Touch pad', nav: 'Back · Home · Apps', media: 'Playback', volume: 'Volume · Keyboard', custom: 'Custom buttons' }
  };
  const ACTIONS = [
    ['open:keystone', fr ? 'Trapèze' : 'Keystone', 'i-desktop'],
    ['open:projection', 'Projection', 'i-desktop'],
    ['hdmi', 'HDMI', 'i-bolt'],
    ['browser', fr ? 'Navigateur' : 'Browser', 'i-globe'],
    ['open:wifi', 'Wi-Fi', 'i-bolt'],
    ['open:bluetooth', 'Bluetooth', 'i-bolt'],
    ['open:settings', fr ? 'Réglages UniDroid' : 'UniDroid settings', 'i-gear'],
    ['settings', fr ? 'Réglages Android' : 'Android settings', 'i-gear'],
    ['apps', fr ? 'Toutes les applis' : 'All apps', 'i-apps']
  ];
  const KEYS = [
    [82, 'Menu', '☰'], [165, 'Info', 'i'], [175, fr ? 'Sous-titres' : 'Subtitles', 'CC'], [84, fr ? 'Recherche' : 'Search', '⌕'],
    [88, fr ? 'Précédent' : 'Previous', '⏮'], [87, fr ? 'Suivant' : 'Next', '⏭'], [86, 'Stop', '■'], [176, fr ? 'Réglages' : 'Settings', '⚙']
  ];
  const DEFAULT = { v: 1, order: ['pad', 'nav', 'media', 'volume', 'custom'], hidden: [], buttons: [] };
  let L = JSON.parse(JSON.stringify(DEFAULT));

  const esc = t => { const d = document.createElement('div'); d.textContent = t; return d.innerHTML; };
  const icon = (id, cls) => '<svg class="i' + (cls ? ' ' + cls : '') + '"><use href="#' + id + '"/></svg>';
  function face(b) {
    if (b.t === 'app') return '<img alt="" src="icon?p=' + encodeURIComponent(b.pkg) + '">';
    if (b.t === 'action') return icon((ACTIONS.find(a => a[0] === b.a) || [])[2] || 'i-bolt');
    if (b.t === 'url') return icon('i-globe');
    return '<span class="k">' + esc(b.sym || '•') + '</span>';
  }
  function press(b) {
    haptic();
    if (b.t === 'app') send('a:launch:' + b.pkg);
    else if (b.t === 'action') send('a:' + b.a);
    else if (b.t === 'url') send('a:url:' + b.url);
    else if (b.t === 'key') send('k:' + b.k);
  }

  // ---- render the remote
  function render() {
    const host = $('#blocks');
    const order = L.order.filter(n => host.querySelector('[data-block="' + n + '"]'));
    for (const n of DEFAULT.order) if (!order.includes(n)) order.push(n);
    order.forEach(n => {
      const el = host.querySelector('[data-block="' + n + '"]');
      host.appendChild(el);
      el.classList.toggle('off', L.hidden.includes(n));
    });
    const box = $('#custom'); box.innerHTML = '';
    L.buttons.forEach(b => {
      const c = document.createElement('div'); c.className = 'cbtn';
      c.innerHTML = '<button class="btn glass" aria-label="' + esc(b.label) + '">' + face(b) + '</button><span>' + esc(b.label) + '</span>';
      const btn = c.querySelector('button');
      btn.addEventListener('touchstart', noDefault, { passive: false });
      btn.addEventListener('pointerdown', e => { e.preventDefault(); btn.classList.add('pressed'); });
      btn.addEventListener('pointerup', () => { if (btn.classList.contains('pressed')) { btn.classList.remove('pressed'); press(b); } });
      btn.addEventListener('pointerleave', () => btn.classList.remove('pressed'));
      box.appendChild(c);
    });
  }
  function apply(json) {
    try {
      const o = JSON.parse(json);
      if (o && o.v === 1) L = { v: 1, order: o.order || DEFAULT.order, hidden: o.hidden || [], buttons: (o.buttons || []).slice(0, 24) };
    } catch (e) { return; }
    render();
    if (document.body.classList.contains('edit-open')) paintEditor();
  }
  function save() { render(); paintEditor(); send('l:' + JSON.stringify(L)); }

  // ---- editor
  function row(html, cls) { const r = document.createElement('div'); r.className = 'row glass' + (cls ? ' ' + cls : ''); r.innerHTML = html; return r; }
  function move(list, i, d) { const j = i + d; if (j < 0 || j >= list.length) return; [list[i], list[j]] = [list[j], list[i]]; save(); }
  function paintEditor() {
    const eb = $('#edit-blocks'); eb.innerHTML = '';
    L.order.forEach((n, i) => {
      const shown = !L.hidden.includes(n);
      const r = row('<span class="t"><b>' + esc(T.blocks[n] || n) + '</b></span><button class="mv" aria-label="Up">↑</button><button class="mv" aria-label="Down">↓</button><span class="switch"></span>', shown ? 'on' : '');
      const [up, down] = r.querySelectorAll('.mv');
      up.disabled = i === 0; down.disabled = i === L.order.length - 1;
      up.addEventListener('click', e => { e.stopPropagation(); move(L.order, i, -1); });
      down.addEventListener('click', e => { e.stopPropagation(); move(L.order, i, 1); });
      r.addEventListener('click', () => {
        L.hidden = shown ? L.hidden.concat(n) : L.hidden.filter(x => x !== n);
        // Never hide everything: the pad stays reachable.
        if (L.order.every(x => L.hidden.includes(x))) L.hidden = L.hidden.filter(x => x !== 'pad');
        save();
      });
      eb.appendChild(r);
    });
    const el = $('#edit-list'); el.innerHTML = '';
    if (!L.buttons.length) { const p = document.createElement('p'); p.className = 'closed-note'; p.style.display = 'block'; p.textContent = T.none; el.appendChild(p); }
    L.buttons.forEach((b, i) => {
      const r = row('<span class="ic">' + face(b) + '</span><span class="t"><b>' + esc(b.label) + '</b></span><button class="mv" aria-label="Up">↑</button><button class="mv" aria-label="Down">↓</button><button class="btn x" aria-label="Remove">×</button>');
      const [up, down] = r.querySelectorAll('.mv');
      up.disabled = i === 0; down.disabled = i === L.buttons.length - 1;
      up.addEventListener('click', () => move(L.buttons, i, -1));
      down.addEventListener('click', () => move(L.buttons, i, 1));
      r.querySelector('.x').addEventListener('click', () => { L.buttons.splice(i, 1); save(); });
      el.appendChild(r);
    });
    $('#edit-haptics').classList.toggle('on', hapticsOn());
  }
  function openEditor() { paintEditor(); document.body.classList.add('edit-open'); }
  function closeEditor() { document.body.classList.remove('edit-open', 'pick-open'); }

  // ---- picker
  let tab = 'apps';
  function addButton(b) { if (L.buttons.length < 24) L.buttons.push(b); document.body.classList.remove('pick-open'); haptic(); save(); }
  function grid(items) {
    const g = document.createElement('div'); g.className = 'grid';
    items.forEach(([b, html]) => {
      const c = document.createElement('div'); c.className = 'cbtn';
      c.innerHTML = '<span class="btn glass" style="width:58px;height:58px;border-radius:50%">' + html + '</span><span>' + esc(b.label) + '</span>';
      c.addEventListener('click', () => addButton(b));
      g.appendChild(c);
    });
    return g;
  }
  async function paintPicker() {
    const seg = $('#pick-seg'); seg.innerHTML = '';
    [['apps', T.apps], ['actions', T.actions], ['keys', T.keys], ['link', T.link]].forEach(([id, label]) => {
      const b = document.createElement('button'); b.textContent = label; b.className = id === tab ? 'on' : '';
      b.addEventListener('click', () => { tab = id; paintPicker(); });
      seg.appendChild(b);
    });
    const body = $('#pick-body'); body.innerHTML = '';
    if (tab === 'apps') {
      let apps = [];
      try { apps = await (await fetch('apps', { cache: 'no-store' })).json(); } catch (e) { /* offline */ }
      if (tab !== 'apps') return;
      if (!apps.length) { const n = document.createElement('p'); n.className = 'note'; n.textContent = T.noApps; body.appendChild(n); return; }
      body.appendChild(grid(apps.map(a => { const b = { t: 'app', pkg: a.pkg, label: a.label }; return [b, face(b)]; })));
    } else if (tab === 'actions') {
      body.appendChild(grid(ACTIONS.map(([a, label]) => { const b = { t: 'action', a, label }; return [b, face(b)]; })));
    } else if (tab === 'keys') {
      body.appendChild(grid(KEYS.map(([k, label, sym]) => { const b = { t: 'key', k, label, sym }; return [b, face(b)]; })));
    } else {
      const f = document.createElement('form');
      f.innerHTML = '<input id="pick-url" type="url" inputmode="url" autocapitalize="off" autocorrect="off" placeholder="' + esc(T.url) + '">'
        + '<input id="pick-name" type="text" maxlength="24" placeholder="' + esc(T.name) + '">'
        + '<button class="btn primary" style="height:48px;border-radius:24px;background:var(--accent);color:#fff;font-weight:600">' + esc(T.save) + '</button>';
      f.addEventListener('submit', e => {
        e.preventDefault();
        let url = f.querySelector('#pick-url').value.trim();
        if (!url) return;
        if (!/^https?:\/\//i.test(url)) url = 'https://' + url;
        const name = f.querySelector('#pick-name').value.trim() || url.replace(/^https?:\/\/(www\.)?/i, '').split('/')[0];
        addButton({ t: 'url', url, label: name });
      });
      body.appendChild(f);
    }
  }

  // ---- wiring
  $('#edit-done').textContent = T.done;
  $('#edit-reset').textContent = T.reset;
  $('#edit-layout').textContent = T.layout;
  $('#edit-buttons').textContent = T.buttons;
  $('#edit-add').textContent = '+ ' + T.add;
  $('#edit-feedback').textContent = T.feedback;
  $('#edit-haptics b').textContent = T.haptics;
  $('#edit-haptics small').textContent = T.hapticsSub;
  $('#pick-back').textContent = '‹ ' + T.back;
  $('#status').insertAdjacentHTML('beforeend', icon('i-edit'));
  $('#status').addEventListener('click', openEditor);
  $('#edit-done').addEventListener('click', closeEditor);
  $('#edit-reset').addEventListener('click', () => { L = JSON.parse(JSON.stringify(DEFAULT)); save(); });
  $('#edit-add').addEventListener('click', () => { document.body.classList.add('pick-open'); paintPicker(); });
  $('#pick-back').addEventListener('click', () => document.body.classList.remove('pick-open'));
  $('#edit-haptics').addEventListener('click', () => {
    try { localStorage.setItem('udr-haptics', hapticsOn() ? 'off' : 'on'); } catch (e) { /* ignore */ }
    paintEditor(); haptic();
  });
  render();
  return { apply };
})();

connect();
</script>
</body>
</html>
