<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>UniDroid Remote</title>
<style>
  :root{
    --bg:#0f1115; --panel:#1a1e26; --panel2:#232936; --accent:#4f8cff;
    --accent2:#2b63c4; --txt:#e8edf5; --muted:#8a93a6; --ok:#36c76f;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none}
  html,body{margin:0;height:100%}
  body{
    background:var(--bg);color:var(--txt);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
    display:flex;flex-direction:column;align-items:center;
    padding:16px;gap:14px;max-width:460px;margin:0 auto;padding-bottom:40px;
  }
  h1{font-size:15px;font-weight:600;letter-spacing:.5px;color:var(--muted);margin:4px 0 0;text-transform:uppercase}
  .row{display:flex;gap:12px;width:100%;justify-content:center}
  button{
    background:var(--panel2);color:var(--txt);border:none;border-radius:16px;
    font-size:20px;font-weight:600;cursor:pointer;transition:transform .05s,background .1s;
    display:flex;align-items:center;justify-content:center;
  }
  button:active{transform:scale(.93);background:var(--accent2)}
  .top button{flex:1;height:56px;font-size:15px;background:var(--panel)}
  .dpad{
    position:relative;width:260px;height:260px;margin:4px auto;
    background:var(--panel);border-radius:50%;
    display:grid;grid-template-columns:1fr 1fr 1fr;grid-template-rows:1fr 1fr 1fr;
  }
  .dpad button{background:transparent;border-radius:0;font-size:26px;color:var(--muted)}
  .dpad button:active{background:transparent;color:var(--accent)}
  .dpad .ok{
    grid-column:2;grid-row:2;background:var(--accent);color:#fff;border-radius:50%;
    margin:10px;font-size:17px;font-weight:700;box-shadow:0 4px 16px rgba(79,140,255,.4)
  }
  .dpad .ok:active{background:var(--accent2)}
  .up{grid-column:2;grid-row:1}.down{grid-column:2;grid-row:3}
  .left{grid-column:1;grid-row:2}.right{grid-column:3;grid-row:2}
  .grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px;width:100%}
  .grid3 button{height:58px;font-size:15px}
  .kb{width:100%;display:flex;gap:10px;margin-top:4px}
  .kb input{
    flex:1;background:var(--panel2);border:2px solid transparent;border-radius:14px;
    color:var(--txt);font-size:17px;padding:0 16px;height:56px;outline:none;-webkit-user-select:text;user-select:text
  }
  .kb input:focus{border-color:var(--accent)}
  .kb .send{width:70px;height:56px;background:var(--accent);color:#fff}
  .mini{display:flex;gap:10px;width:100%}
  .mini button{flex:1;height:48px;font-size:14px;background:var(--panel)}
  .toast{
    position:fixed;bottom:14px;left:50%;transform:translateX(-50%) translateY(60px);
    background:var(--ok);color:#06220f;padding:8px 18px;border-radius:20px;font-size:13px;font-weight:700;
    transition:transform .25s;pointer-events:none;opacity:.95
  }
  .toast.show{transform:translateX(-50%) translateY(0)}
  .toast.err{background:#e5484d;color:#fff}
  .lbl{font-size:11px;color:var(--muted);width:100%;text-align:center;margin:-4px 0 -6px}
</style>
</head>
<body>
  <h1>UniDroid Remote</h1>

  <div class="row top">
    <button onclick="K('POWER')">⏻ Power</button>
    <button onclick="K('HOME')">⌂ Home</button>
    <button onclick="K('BACK')">← Back</button>
  </div>

  <div class="dpad">
    <button class="up"    onclick="K('DPAD_UP')">▲</button>
    <button class="left"  onclick="K('DPAD_LEFT')">◀</button>
    <button class="ok"    onclick="K('DPAD_CENTER')">OK</button>
    <button class="right" onclick="K('DPAD_RIGHT')">▶</button>
    <button class="down"  onclick="K('DPAD_DOWN')">▼</button>
  </div>

  <div class="grid3">
    <button onclick="K('VOLUME_DOWN')">🔉 −</button>
    <button onclick="K('VOLUME_MUTE')">🔇</button>
    <button onclick="K('VOLUME_UP')">🔊 +</button>
  </div>

  <div class="grid3">
    <button onclick="K('MENU')">☰ Menu</button>
    <button onclick="K('MEDIA_PLAY_PAUSE')">⏯</button>
    <button onclick="K('APP_SWITCH')">▭ Apps</button>
  </div>

  <div class="lbl">Keyboard — type, then Send</div>
  <div class="kb">
    <input id="t" type="text" placeholder="Text to type on the device…"
           autocapitalize="off" autocomplete="off" autocorrect="off" spellcheck="false"
           onkeydown="if(event.key==='Enter')sendText()">
    <button class="send" onclick="sendText()">↑</button>
  </div>
  <div class="mini">
    <button onclick="K('DEL')">⌫ Delete</button>
    <button onclick="K('ENTER')">⏎ Enter</button>
    <button onclick="K('SEARCH')">🔍 Search</button>
  </div>

  <div id="toast" class="toast">OK</div>

<script>
  const toast=document.getElementById('toast');
  let tmr;
  function flash(msg,err){
    toast.textContent=msg; toast.classList.toggle('err',!!err); toast.classList.add('show');
    clearTimeout(tmr); tmr=setTimeout(()=>toast.classList.remove('show'),900);
  }
  function buzz(){ if(navigator.vibrate) navigator.vibrate(12); }
  async function K(code){
    buzz();
    try{ const r=await fetch('/cgi-bin/key?k='+code); if(!r.ok)throw 0; }
    catch(e){ flash('offline',true); }
  }
  async function sendText(){
    const el=document.getElementById('t'); const v=el.value;
    if(!v) return;
    buzz();
    try{
      const r=await fetch('/cgi-bin/text?t='+encodeURIComponent(v));
      if(!r.ok)throw 0; flash('sent'); el.value='';
    }catch(e){ flash('offline',true); }
  }
</script>
</body>
</html>
